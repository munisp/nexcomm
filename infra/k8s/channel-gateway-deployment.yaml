---
# Kubernetes Deployment + Service for channel-gateway
# Generated by NEXCOM Round 61 — do not edit manually
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-gateway
  namespace: nexcom
  labels:
    app: channel-gateway
    app.kubernetes.io/name: channel-gateway
    app.kubernetes.io/part-of: nexcom-exchange
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: channel-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: channel-gateway
        app.kubernetes.io/name: channel-gateway
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "channel-gateway"
        dapr.io/app-port: "8093"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8093"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nexcom-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: channel-gateway
          image: nexcom/channel-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8093
              protocol: TCP
          env:
        - name: SERVICE_NAME
          value: "channel-gateway"
        - name: PORT
          value: "8093"
        - name: LOG_LEVEL
          value: "info"
        - name: KAFKA_BROKERS
          valueFrom:
            secretKeyRef:
              name: nexcom-secrets
              key: KAFKA_BROKERS
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: nexcom-secrets
              key: REDIS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: channel-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: channel-gateway
  namespace: nexcom
  labels:
    app: channel-gateway
    app.kubernetes.io/name: channel-gateway
    app.kubernetes.io/part-of: nexcom-exchange
spec:
  selector:
    app: channel-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: channel-gateway-pdb
  namespace: nexcom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: channel-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: channel-gateway-hpa
  namespace: nexcom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channel-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
