                  key: TEMPORAL_ADDRESS
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: nexcom-temporal-secret
                  key: TEMPORAL_NAMESPACE
            - name: TEMPORAL_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: nexcom-temporal-secret
                  key: TEMPORAL_TLS_CERT
                  optional: true
            - name: TEMPORAL_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: nexcom-temporal-secret
                  key: TEMPORAL_TLS_KEY
                  optional: true
            - name: NEXCOM_PG_URL
              valueFrom:
                secretKeyRef:
                  name: nexcom-db-secret
                  key: NEXCOM_PG_URL
            - name: TIGERBEETLE_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: nexcom-infra-secret
                  key: TIGERBEETLE_GATEWAY_URL
                  optional: true
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: nexcom-infra-secret
                  key: KAFKA_BROKERS
                  optional: true
