---
# ─── PodDisruptionBudget ─────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-workers-pdb
  namespace: nexcom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: temporal-worker
