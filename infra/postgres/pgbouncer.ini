# =============================================================================
# NEXCOM Commodity Exchange — PgBouncer Configuration
# Transaction-mode pooling for high-concurrency trading workloads
# Target: 10,000 application connections → 100 PostgreSQL connections
# =============================================================================

[databases]
# Primary database — all application traffic
nexcom = host=postgres-service port=5432 dbname=nexcom

# Read replica — for analytics and reporting queries
nexcom_read = host=postgres-replica-service port=5432 dbname=nexcom

[pgbouncer]
# ── Pool Mode ─────────────────────────────────────────────────────────────────
# transaction: connection returned to pool after each transaction.
# This is the most efficient mode for short-lived tRPC procedures.
# WARNING: Do NOT use session-level features (SET, advisory locks, LISTEN/NOTIFY)
# with transaction mode — use session mode for those specific connections.
pool_mode = transaction

# ── Connection Limits ─────────────────────────────────────────────────────────
# max_client_conn: maximum total client connections to PgBouncer
max_client_conn = 10000

# default_pool_size: number of server connections per database+user pair
# 100 connections × 2 databases = 200 total PostgreSQL connections (within max_connections=200)
default_pool_size = 100

# min_pool_size: keep at least this many server connections open (warm pool)
min_pool_size = 10

# reserve_pool_size: extra connections for bursts above default_pool_size
reserve_pool_size = 20

# reserve_pool_timeout: seconds to wait before using reserve pool
reserve_pool_timeout = 3

# max_db_connections: hard cap on total server connections per database
max_db_connections = 150

# ── Timeouts ──────────────────────────────────────────────────────────────────
# server_idle_timeout: close idle server connections after 600s
server_idle_timeout = 600

# client_idle_timeout: close idle client connections after 0 (disabled)
client_idle_timeout = 0

# server_connect_timeout: timeout for new server connections
server_connect_timeout = 15

# query_timeout: kill queries running longer than 30s (prevents runaway queries)
query_timeout = 30

# transaction_timeout: kill transactions running longer than 60s
transaction_timeout = 60

# ── Authentication ─────────────────────────────────────────────────────────────
# auth_type: md5 for password authentication (use scram-sha-256 if PostgreSQL 14+)
auth_type = scram-sha-256

# auth_file: file containing user:password pairs (managed by Vault)
auth_file = /etc/pgbouncer/userlist.txt

# admin_users: users allowed to connect to the pgbouncer admin console
admin_users = pgbouncer_admin

# stats_users: users allowed to view statistics
stats_users = pgbouncer_monitor,pgbouncer_admin

# ── TLS ───────────────────────────────────────────────────────────────────────
# client_tls_sslmode: require TLS from all application clients
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_ca_file = /etc/pgbouncer/tls/ca.crt

# server_tls_sslmode: require TLS to PostgreSQL server
server_tls_sslmode = require
server_tls_ca_file = /etc/pgbouncer/tls/ca.crt

# ── Logging ───────────────────────────────────────────────────────────────────
# log_connections: log each new client connection
log_connections = 1

# log_disconnections: log each client disconnection
log_disconnections = 1

# log_pooler_errors: log server connection errors
log_pooler_errors = 1

# stats_period: how often to log statistics (seconds)
stats_period = 60

# ── Networking ────────────────────────────────────────────────────────────────
# listen_addr: bind to all interfaces (Kubernetes pod IP)
listen_addr = *

# listen_port: PgBouncer listens on 5432 (same as PostgreSQL for transparent proxying)
listen_port = 5432

# unix_socket_dir: also listen on Unix socket for same-pod connections
unix_socket_dir = /var/run/postgresql

# tcp_keepalive: enable TCP keepalive to detect dead connections
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 60
tcp_keepintvl = 10

# ── Performance ───────────────────────────────────────────────────────────────
# server_reset_query: reset session state between transactions
# DISCARD ALL resets all session state (SET, temp tables, prepared statements)
server_reset_query = DISCARD ALL

# server_check_query: lightweight query to verify server is alive
server_check_query = SELECT 1

# server_check_delay: how often to check server health (seconds)
server_check_delay = 30

# ignore_startup_parameters: suppress warnings for parameters set by ORMs
ignore_startup_parameters = extra_float_digits,options
