# =============================================================================
# NEXCOM Commodity Exchange — PostgreSQL Production Configuration
# Optimised for high-throughput financial trading workloads
# Target: 50,000+ TPS, P99 query latency < 5ms
# Assumes: 32GB RAM, 8-core CPU, NVMe SSD storage
# =============================================================================
# Apply via: kubectl create configmap postgres-config --from-file=postgresql.conf
# Or mount as ConfigMap volume at /etc/postgresql/postgresql.conf

# ── Memory ────────────────────────────────────────────────────────────────────
# shared_buffers: 25% of total RAM for PostgreSQL's own buffer cache
shared_buffers = 8GB

# effective_cache_size: estimate of OS page cache available (75% of RAM)
# Used by query planner to decide index vs sequential scan
effective_cache_size = 24GB

# work_mem: per-sort/hash operation memory. 64MB × max_connections can be large.
# For trading workloads with complex aggregations, 64MB is appropriate.
work_mem = 64MB

# maintenance_work_mem: used for VACUUM, CREATE INDEX, ALTER TABLE
maintenance_work_mem = 2GB

# huge_pages: use Linux huge pages to reduce TLB pressure on large shared_buffers
huge_pages = try

# ── WAL (Write-Ahead Log) ─────────────────────────────────────────────────────
# wal_buffers: WAL write buffer. 256MB significantly reduces WAL I/O for burst writes.
wal_buffers = 256MB

# max_wal_size: maximum WAL size before checkpoint is forced.
# Larger value = fewer checkpoints = less I/O = higher throughput.
max_wal_size = 4GB

# min_wal_size: keep at least this much WAL to avoid frequent recycling
min_wal_size = 1GB

# checkpoint_completion_target: spread checkpoint I/O over this fraction of
# the checkpoint interval. 0.9 = 90% of the interval, reducing I/O spikes.
checkpoint_completion_target = 0.9

# wal_compression: compress WAL records to reduce I/O bandwidth
wal_compression = on

# synchronous_commit = local: writes are durable on the primary before ACK,
# but async replication to standby. Balances durability and throughput.
# Do NOT set to 'off' for a financial exchange — this risks data loss.
synchronous_commit = local

# wal_writer_delay: how often the WAL writer flushes. 10ms is appropriate
# for trading workloads that batch many small transactions.
wal_writer_delay = 10ms

# ── Checkpoint ────────────────────────────────────────────────────────────────
# checkpoint_timeout: maximum time between automatic checkpoints.
# 15 minutes reduces checkpoint frequency for write-heavy workloads.
checkpoint_timeout = 15min

# ── Query Planner ─────────────────────────────────────────────────────────────
# random_page_cost: cost of a non-sequential page fetch.
# 1.1 for NVMe SSD (vs default 4.0 for spinning disk).
# Encourages index scans over sequential scans.
random_page_cost = 1.1

# seq_page_cost: cost of a sequential page fetch. Keep at 1.0.
seq_page_cost = 1.0

# effective_io_concurrency: number of concurrent I/O operations.
# 200 for NVMe SSD with high queue depth.
effective_io_concurrency = 200

# parallel_tuple_cost / parallel_setup_cost: tune parallel query planning
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# max_parallel_workers_per_gather: parallel workers for a single query
max_parallel_workers_per_gather = 4

# max_parallel_workers: total parallel worker processes
max_parallel_workers = 8

# ── Connections ───────────────────────────────────────────────────────────────
# max_connections: set low because PgBouncer handles connection pooling.
# Direct connections are only for admin/monitoring tools.
max_connections = 200

# ── Autovacuum ────────────────────────────────────────────────────────────────
# Aggressive autovacuum settings for high-write tables (orders, settlements)
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.01    # Vacuum after 1% of table is dirty
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.005  # Analyze after 0.5% of table changes
autovacuum_vacuum_cost_delay = 2ms       # Reduce I/O throttling for fast storage
autovacuum_vacuum_cost_limit = 400       # Allow more work per vacuum cycle

# ── Logging ───────────────────────────────────────────────────────────────────
# Log slow queries for performance analysis
log_min_duration_statement = 100        # Log queries slower than 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB                   # Log temp files larger than 10MB
log_autovacuum_min_duration = 1000      # Log autovacuum runs > 1 second

# Log format for structured parsing by Wazuh/Loki
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

# ── Statistics ────────────────────────────────────────────────────────────────
# track_io_timing: enable I/O timing in pg_stat_* views (small overhead)
track_io_timing = on

# default_statistics_target: more statistics = better query plans
# 200 is appropriate for tables with skewed distributions (e.g., orders by symbol)
default_statistics_target = 200

# ── Replication ───────────────────────────────────────────────────────────────
# wal_level: logical replication enables CDC (Change Data Capture) for Kafka
wal_level = logical

# max_replication_slots: for streaming replication + logical replication slots
max_replication_slots = 10

# max_wal_senders: for streaming replication to standby replicas
max_wal_senders = 10

# ── Extensions ────────────────────────────────────────────────────────────────
# Preload performance-critical extensions at startup
shared_preload_libraries = 'pg_stat_statements,pgaudit,auto_explain'

# pg_stat_statements: track query performance statistics
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# pgaudit: statement-level audit logging for ISO 27001 compliance
pgaudit.log = 'write,ddl'
pgaudit.log_catalog = off
pgaudit.log_relation = on

# auto_explain: automatically log execution plans for slow queries
auto_explain.log_min_duration = 500ms
auto_explain.log_analyze = on
auto_explain.log_buffers = on
