# NEXCOM Exchange — PostgreSQL Runtime Configuration ConfigMap
# Injected into the postgres StatefulSet via envFrom / volumeMount
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexcom-postgres-config
  namespace: nexcom
  labels:
    app: nexcom-postgres
    component: database
data:
  # ── Connection ──────────────────────────────────────────────────────────────
  POSTGRES_DB: nexcom
  POSTGRES_USER: nexcom
  PG_MAX_CONNECTIONS: "500"
  PG_SUPERUSER_RESERVED_CONNECTIONS: "5"

  # ── Memory ──────────────────────────────────────────────────────────────────
  PG_SHARED_BUFFERS: "2GB"
  PG_EFFECTIVE_CACHE_SIZE: "6GB"
  PG_WORK_MEM: "16MB"
  PG_MAINTENANCE_WORK_MEM: "512MB"
  PG_TEMP_BUFFERS: "32MB"

  # ── WAL / Durability ────────────────────────────────────────────────────────
  PG_WAL_LEVEL: logical
  PG_MAX_WAL_SIZE: "4GB"
  PG_MIN_WAL_SIZE: "512MB"
  PG_CHECKPOINT_COMPLETION_TARGET: "0.9"
  PG_WAL_BUFFERS: "64MB"
  PG_SYNCHRONOUS_COMMIT: "on"
  PG_FSYNC: "on"

  # ── Replication ─────────────────────────────────────────────────────────────
  PG_MAX_WAL_SENDERS: "10"
  PG_MAX_REPLICATION_SLOTS: "10"
  PG_HOT_STANDBY: "on"
  PG_HOT_STANDBY_FEEDBACK: "on"

  # ── Query Planner ───────────────────────────────────────────────────────────
  PG_RANDOM_PAGE_COST: "1.1"
  PG_EFFECTIVE_IO_CONCURRENCY: "200"
  PG_DEFAULT_STATISTICS_TARGET: "100"
  PG_ENABLE_PARTITIONWISE_JOIN: "on"
  PG_ENABLE_PARTITIONWISE_AGGREGATE: "on"

  # ── Autovacuum ──────────────────────────────────────────────────────────────
  PG_AUTOVACUUM: "on"
  PG_AUTOVACUUM_MAX_WORKERS: "4"
  PG_AUTOVACUUM_NAPTIME: "30s"
  PG_AUTOVACUUM_VACUUM_SCALE_FACTOR: "0.05"
  PG_AUTOVACUUM_ANALYZE_SCALE_FACTOR: "0.02"
  PG_AUTOVACUUM_VACUUM_COST_DELAY: "2ms"

  # ── Logging ─────────────────────────────────────────────────────────────────
  PG_LOG_MIN_DURATION_STATEMENT: "500"
  PG_LOG_CHECKPOINTS: "on"
  PG_LOG_CONNECTIONS: "off"
  PG_LOG_DISCONNECTIONS: "off"
  PG_LOG_LOCK_WAITS: "on"
  PG_LOG_TEMP_FILES: "0"
  PG_LOG_AUTOVACUUM_MIN_DURATION: "250ms"

  # ── Parallel Query ──────────────────────────────────────────────────────────
  PG_MAX_PARALLEL_WORKERS_PER_GATHER: "4"
  PG_MAX_PARALLEL_WORKERS: "8"
  PG_MAX_PARALLEL_MAINTENANCE_WORKERS: "4"

  # ── Extensions ──────────────────────────────────────────────────────────────
  PG_SHARED_PRELOAD_LIBRARIES: "pg_stat_statements,pg_partman_bgw,auto_explain"
  PG_AUTO_EXPLAIN_LOG_MIN_DURATION: "1000"
  PG_AUTO_EXPLAIN_LOG_ANALYZE: "on"
  PG_PG_STAT_STATEMENTS_MAX: "10000"
  PG_PG_STAT_STATEMENTS_TRACK: all

  # ── Locale ──────────────────────────────────────────────────────────────────
  PG_LC_MESSAGES: "en_US.UTF-8"
  PG_LC_MONETARY: "en_US.UTF-8"
  PG_LC_NUMERIC: "en_US.UTF-8"
  PG_LC_TIME: "en_US.UTF-8"
  PG_TIMEZONE: "UTC"
