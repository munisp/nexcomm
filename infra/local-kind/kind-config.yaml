# Local-only Kubernetes-in-Docker cluster configuration.
# Host ports bind to loopback so the cluster is not exposed on the LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 18443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
