# Coraza WAF base configuration for NEXCOM Exchange
# Loaded by Caddy's coraza_waf directive

# ── Engine mode ───────────────────────────────────────────────────────────────
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# ── Request body limits ───────────────────────────────────────────────────────
# Allow up to 10MB for commodity order bulk uploads and KYC documents
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

# ── Audit logging ─────────────────────────────────────────────────────────────
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogFormat JSON
SecAuditLog /var/log/caddy/coraza_audit.log
SecAuditLogParts ABIJDEFHZ

# ── Debug logging (set to 0 in production) ───────────────────────────────────
SecDebugLog /var/log/caddy/coraza_debug.log
SecDebugLogLevel 0

# ── Default action ────────────────────────────────────────────────────────────
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# ── Content type handling ─────────────────────────────────────────────────────
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:1000,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

# ── NEXCOM-specific exclusions ────────────────────────────────────────────────
# Exclude Stripe webhook signature header from WAF inspection
SecRuleUpdateTargetById 920270 "!REQUEST_HEADERS:Stripe-Signature"

# Allow base64-encoded KYC document uploads
SecRuleUpdateTargetById 920300 "!REQUEST_BODY"

# Exclude Temporal workflow payload fields (contain binary data)
SecRuleUpdateTargetById 942100 "!ARGS:workflowInput"
SecRuleUpdateTargetById 942110 "!ARGS:workflowInput"

# Allow Africa's Talking USSD session tokens (contain special chars)
SecRuleUpdateTargetById 942430 "!REQUEST_HEADERS:AT-Session-ID"

# ── IP reputation ─────────────────────────────────────────────────────────────
# Block known Tor exit nodes and VPN abuse IPs (supplemented by CrowdSec)
SecRule REMOTE_ADDR "@ipMatchFromFile /etc/caddy/blocklist.txt" \
    "id:1100,phase:1,deny,status:403,log,msg:'Blocked IP address'"
