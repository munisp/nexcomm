# ─────────────────────────────────────────────────────────────────────────────
# NEXCOM Exchange — Caddy Kubernetes Deployment
# Namespace: nexcom-ingress
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: nexcom-ingress
  labels:
    app.kubernetes.io/part-of: nexcom-exchange
---
# ConfigMap: Caddyfile
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: nexcom-ingress
  labels:
    app: caddy
    app.kubernetes.io/part-of: nexcom-exchange
data:
  Caddyfile: |
    # Loaded from infra/caddy/Caddyfile — see that file for the full config.
    # In production, this ConfigMap is generated by Helm from the Caddyfile.
    # Placeholder — replaced by helm template rendering.
---
# ConfigMap: Coraza WAF rules (OWASP CRS)
apiVersion: v1
kind: ConfigMap
metadata:
  name: coraza-crs-config
  namespace: nexcom-ingress
data:
  crs-setup.conf: |
    # NEXCOM-specific CRS tuning
    SecDefaultAction "phase:1,log,auditlog,pass"
    SecDefaultAction "phase:2,log,auditlog,pass"
    # Paranoia level 2 for financial platform
    SecAction \
      "id:900000,\
       phase:1,\
       nolog,\
       pass,\
       t:none,\
       setvar:tx.paranoia_level=2"
    # Anomaly scoring thresholds
    SecAction \
      "id:900110,\
       phase:1,\
       nolog,\
       pass,\
       t:none,\
       setvar:tx.inbound_anomaly_score_threshold=5,\
       setvar:tx.outbound_anomaly_score_threshold=4"
    # Allow large JSON payloads for bulk commodity orders
    SecAction \
      "id:900200,\
       phase:1,\
       nolog,\
       pass,\
       t:none,\
       setvar:tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data|"
---
# Secret: Caddy environment variables
# In production, use Sealed Secrets or External Secrets Operator.
# This manifest shows the structure — values are injected at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: caddy-env
  namespace: nexcom-ingress
  annotations:
    # Managed by External Secrets Operator — do not edit manually
    external-secrets.io/managed: "true"
type: Opaque
stringData:
  CADDY_ACME_EMAIL: "platform@nexcomexchange.com"
  CADDY_ACME_DNS_PROVIDER: "cloudflare"
  CADDY_ACME_DNS_TOKEN: ""        # Injected by ESO from Vault
  CROWDSEC_API_KEY: ""            # Injected by ESO from Vault
  INTERNAL_NETWORK: "10.0.0.0/8"
  ADMIN_CIDR: "10.100.0.0/16"    # Office + VPN CIDR
  VPN_CIDR: "10.200.0.0/16"
---
# PersistentVolumeClaim: Caddy TLS certificate storage
# CertMagic stores certificates here — must survive pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-tls-storage
  namespace: nexcom-ingress
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-ssd
  resources:
    requests:
      storage: 1Gi
---
# Deployment: Caddy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: nexcom-ingress
  labels:
    app: caddy
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: nexcom-exchange
    app.kubernetes.io/version: "2.9.0"
spec:
  # Single replica — CertMagic uses file-based cert storage (PVC).
  # For HA, use an external cert storage backend (Redis/etcd) and set replicas: 3.
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: caddy
        app.kubernetes.io/name: caddy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2019"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: caddy
      securityContext:
        runAsNonRoot: false  # Caddy needs port 80/443 — requires root or NET_BIND_SERVICE
        fsGroup: 1000

      containers:
        - name: caddy
          # Custom xcaddy build with Coraza, L4, CrowdSec, caddy-security modules
          image: nexcom/caddy-custom:2.9.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: https-udp
              containerPort: 443
              protocol: UDP
            - name: admin
              containerPort: 2019
              protocol: TCP
            - name: smpp
              containerPort: 2775
              protocol: TCP
            - name: kafka-tls
              containerPort: 9093
              protocol: TCP
            - name: redis-tls
              containerPort: 6380
              protocol: TCP
            - name: pg-tls
              containerPort: 5433
              protocol: TCP
            - name: ssh-admin
              containerPort: 2222
              protocol: TCP

          envFrom:
            - secretRef:
                name: caddy-env

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: coraza-crs
              mountPath: /etc/caddy/coraza/crs-setup.conf
              subPath: crs-setup.conf
              readOnly: true
            - name: tls-storage
              mountPath: /data/caddy
            - name: logs
              mountPath: /var/log/caddy
            - name: internal-ca
              mountPath: /etc/caddy/certs
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5

          lifecycle:
            preStop:
              exec:
                # Graceful shutdown — wait for in-flight requests
                command: ["/bin/sh", "-c", "caddy stop"]

      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: coraza-crs
          configMap:
            name: coraza-crs-config
        - name: tls-storage
          persistentVolumeClaim:
            claimName: caddy-tls-storage
        - name: logs
          emptyDir: {}
        - name: internal-ca
          secret:
            secretName: nexcom-internal-ca

      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: caddy
---
# Service: Caddy (LoadBalancer — external ingress)
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: nexcom-ingress
  labels:
    app: caddy
  annotations:
    # AWS NLB — preserve client IPs, enable cross-zone load balancing
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: https-udp
      port: 443
      targetPort: 443
      protocol: UDP
    - name: smpp
      port: 2775
      targetPort: 2775
      protocol: TCP
    - name: kafka-tls
      port: 9093
      targetPort: 9093
      protocol: TCP
    - name: redis-tls
      port: 6380
      targetPort: 6380
      protocol: TCP
    - name: pg-tls
      port: 5433
      targetPort: 5433
      protocol: TCP
    - name: ssh-admin
      port: 2222
      targetPort: 2222
      protocol: TCP
---
# ServiceAccount for Caddy
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy
  namespace: nexcom-ingress
---
# ServiceMonitor for Prometheus scraping of Caddy metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: caddy
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - nexcom-ingress
  selector:
    matchLabels:
      app: caddy
  endpoints:
    - port: admin
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
