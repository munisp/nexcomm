# TEMPLATE ONLY. Do not apply with literal placeholder values.
# Prefer the command below, which sources the untracked environment file:
# kubectl -n nexcom-staging create secret generic nexcom-staging-secrets \
#   --from-env-file=.env.staging.secrets --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: nexcom-staging-secrets
  namespace: nexcom-staging
  labels:
    app.kubernetes.io/part-of: nexcom
    app.kubernetes.io/component: staging-runtime
  annotations:
    # Track rotation externally; do not store secret values in this manifest.
    nexcom.io/managed-by: approved-secret-manager
    nexcom.io/rotation-required: "true"
type: Opaque
stringData:
  DATABASE_URL: ${DATABASE_URL_FROM_SECRET_MANAGER}
  POSTGRES_URL: ${POSTGRES_URL_FROM_SECRET_MANAGER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_FROM_SECRET_MANAGER}
  JWT_SECRET: ${JWT_SECRET_FROM_SECRET_MANAGER}
  REDIS_URL: ${REDIS_URL_FROM_SECRET_MANAGER}
  REDIS_PASSWORD: ${REDIS_PASSWORD_FROM_SECRET_MANAGER}
  KAFKA_BROKERS: ${KAFKA_BROKERS_FROM_SECRET_MANAGER}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME_FROM_SECRET_MANAGER}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD_FROM_SECRET_MANAGER}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_FROM_SECRET_MANAGER}
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID_FROM_SECRET_MANAGER}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET_FROM_SECRET_MANAGER}
  APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY_FROM_SECRET_MANAGER}
  INTERNAL_SECRET: ${INTERNAL_SECRET_FROM_SECRET_MANAGER}
