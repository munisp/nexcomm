# Staging overrides
# Usage: helm upgrade --install nexcom-staging ./infra/helm/nexcom -f values.yaml -f values-staging.yaml

global:
  namespace: nexcom-staging
  # CI must replace this tag with the signed image digest before apply.
  imageTag: "1.0.0"
  imagePullPolicy: Always
  requireImageDigest: true
  environment: staging
  secretName: nexcom-staging-secrets
  dapr:
    enabled: true
    config: nexcom-runtime
    appProtocol: http
    httpPort: "3500"
    grpcPort: "50001"
    logLevel: info
  dependencies:
    keycloak:
      url: http://keycloak.nexcom-iam.svc.cluster.local:8080
      realm: nexcom
      clientId: nexcom-gateway
    permify:
      # Internal TLS is required because the gateway sends a bearer token.
      endpoint: https://permify.nexcom-staging.svc.cluster.local:3476
      tenantId: t1
    temporal:
      host: temporal-frontend.temporal.svc.cluster.local:7233
      namespace: nexcom
      taskQueue: nexcom-main
    tigerbeetle:
      addresses: tigerbeetle.nexcom-staging.svc.cluster.local:3001
    fluvio:
      endpoint: fluvio-proxy.nexcom-staging.svc.cluster.local:9003
    apisix:
      adminUrl: http://apisix-admin.nexcom-staging.svc.cluster.local:9180
    redis:
      host: redis.nexcom-staging.svc.cluster.local:6379
      tls: true
    kafka:
      brokers: kafka-bootstrap.nexcom-staging.svc.cluster.local:9093
      authType: sasl
      saslMechanism: SHA-512
      tls: true
    corsOrigins: https://staging.nexcom.exchange

nexcomExchange:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 4

matchingEngine:
  replicaCount: 1

tradingEngine:
  replicaCount: 1

riskManagement:
  replicaCount: 1

kycService:
  replicaCount: 1

amlAlertSubscriber:
  replicaCount: 1

analyticsEngine:
  replicaCount: 1

aiMl:
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

temporalWorkers:
  replicaCount: 1

ingress:
  hosts:
    - host: staging.nexcom.exchange
      paths:
        - path: /
          pathType: Prefix
          service: nexcom-exchange
          port: 80
  tls:
    - secretName: nexcom-tls-staging
      hosts:
        - staging.nexcom.exchange
