# NEXCOM Exchange — Helm values
# Override per environment: helm upgrade --install nexcom ./infra/helm/nexcom -f values-prod.yaml

# ── Global settings ────────────────────────────────────────────────────────────
global:
  namespace: nexcom
  imageRegistry: nexcom
  imageTag: latest
  imagePullPolicy: IfNotPresent
  serviceAccountName: nexcom-service-account
  secretName: nexcom-secrets

  # Common resource defaults (overridable per service)
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Common probes
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

  # Dapr sidecar injection
  dapr:
    enabled: true
    appPort: 3000

  # Prometheus scraping
  prometheus:
    scrape: true
    port: "3000"
    path: /metrics

# ── Per-service configuration ──────────────────────────────────────────────────

nexcomExchange:
  enabled: true
  replicaCount: 3
  image:
    name: nexcom-exchange
  port: 3000
  hpa:
    minReplicas: 3
    maxReplicas: 9
    cpuUtilization: 70
    memoryUtilization: 80
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

