# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: nexcom.exchange
      paths:
        - path: /
          pathType: Prefix
          service: nexcom-exchange
          port: 80
    - host: api.nexcom.exchange
      paths:
        - path: /
          pathType: Prefix
          service: nexcom-exchange
          port: 80
  tls:
    - secretName: nexcom-tls
      hosts:
        - nexcom.exchange
        - api.nexcom.exchange

# ── Namespace ──────────────────────────────────────────────────────────────────
namespace:
  create: true
  labels:
    app.kubernetes.io/managed-by: Helm
    environment: production

# ── RBAC ──────────────────────────────────────────────────────────────────────
rbac:
  create: true

# ── Network Policy ─────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
