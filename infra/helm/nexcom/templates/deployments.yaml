{{/*
  Generic Deployment + Service + HPA template for all NEXCOM microservices.
  Each service is driven by its values block. The nexcom-exchange service
  gets special treatment (larger resources, HPA).
*/}}

{{- define "nexcom.deployment" -}}
{{- $svc := .svc -}}
{{- $g := .g -}}
{{- $name := $svc.name -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: nexcom-exchange
    app.kubernetes.io/version: {{ $g.imageTag | quote }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}
      annotations:
        {{- if $g.dapr.enabled }}
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ $name | quote }}
        dapr.io/app-port: {{ $g.dapr.appPort | quote }}
        {{- end }}
        {{- if $g.prometheus.scrape }}
        prometheus.io/scrape: {{ $g.prometheus.scrape | quote }}
        prometheus.io/port: {{ $svc.port | toString | quote }}
        prometheus.io/path: {{ $g.prometheus.path | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ $g.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ $name }}
          image: {{ $g.imageRegistry }}/{{ $svc.image.name }}:{{ $g.imageTag }}
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: {{ $name | quote }}
            - name: PORT
              value: {{ $svc.port | toString | quote }}
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $g.secretName }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $g.secretName }}
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $g.secretName }}
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: {{ $g.secretName }}
                  key: KAFKA_BROKERS
          resources:
            {{- if $svc.resources }}
            {{- toYaml $svc.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $g.resources | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $g.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $g.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $g.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $g.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $g.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $g.probes.readiness.periodSeconds }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: nexcom-exchange
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-pdb
  namespace: {{ $g.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
{{- if $svc.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-hpa
  namespace: {{ $g.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.hpa.minReplicas | default 1 }}
  maxReplicas: {{ $svc.hpa.maxReplicas | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.cpuUtilization | default 70 }}
    {{- if $svc.hpa.memoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.memoryUtilization }}
    {{- end }}
{{- end }}
{{- end }}

