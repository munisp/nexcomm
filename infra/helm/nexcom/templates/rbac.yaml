{{- if .Values.rbac.create }}
---
# Application pods access only the explicitly injected Secret keys declared in
# their PodSpecs. They do not need Kubernetes API permissions at runtime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.serviceAccountName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nexcom.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
