---
# ═══════════════════════════════════════════════════════════════════════════════
# NEXCOM Exchange — Rust Matching Engine HA Deployment
#
# HA Contract:
#   • minReplicas: 3 (one per AZ via topologySpreadConstraints)
#   • PodDisruptionBudget: maxUnavailable=1 (always ≥2 replicas serving)
#   • Leader election via Kubernetes Lease (only PRIMARY accepts writes)
#   • STANDBY replicas maintain warm order-book state via Kafka replay
#   • KEDA scales 3→20 based on Kafka consumer-group lag on orders.inbound
#   • Rolling update: maxSurge=1, maxUnavailable=0 (zero-downtime)
#   • Liveness: /health every 10s, 3 failures → restart
#   • Readiness: /health/ready every 5s, 2 failures → remove from LB
#   • Startup probe: 60s grace for order-book warm-up from Kafka
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexcom-matching-engine
  namespace: nexcom-engines
  labels:
    app: nexcom-matching-engine
    app.kubernetes.io/name: matching-engine
    app.kubernetes.io/component: exchange-core
    app.kubernetes.io/part-of: nexcom-exchange
    app.kubernetes.io/version: "0.1.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
    nexcom.io/ha-mode: "leader-standby"
    nexcom.io/min-replicas: "3"
spec:
  # Base replica count — KEDA will override this dynamically
  replicas: 3
  selector:
    matchLabels:
      app: nexcom-matching-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take a pod down before the replacement is ready
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nexcom-matching-engine
        app.kubernetes.io/name: matching-engine
        app.kubernetes.io/part-of: nexcom-exchange
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # Dapr sidecar
        dapr.io/enabled: "true"
        dapr.io/app-id: "matching-engine"
        dapr.io/app-port: "8080"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9091"
    spec:
      serviceAccountName: nexcom-engine
      terminationGracePeriodSeconds: 30

      # ── Anti-affinity: spread across nodes AND availability zones ────────────
      affinity:
        podAntiAffinity:
          # Hard: never two matching-engine pods on the same node
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nexcom-matching-engine
              topologyKey: kubernetes.io/hostname
          # Soft: prefer different AZs
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: nexcom-matching-engine
                topologyKey: topology.kubernetes.io/zone

      # ── Topology spread: even distribution across 3 AZs ─────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nexcom-matching-engine

      # ── Init container: wait for Kafka and Redis to be ready ─────────────────
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-0.kafka-headless.kafka.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."; sleep 2;
              done
              echo "Kafka ready"
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "32Mi" }
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-sentinel-0.redis-sentinel.redis.svc.cluster.local 26379; do
                echo "Waiting for Redis Sentinel..."; sleep 2;
              done
              echo "Redis Sentinel ready"
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "50m", memory: "32Mi" }

      containers:
        - name: matching-engine
          image: nexcom/matching-engine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # ── Environment ─────────────────────────────────────────────────────
          env:
            - name: PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Leader election lease name
            - name: LEADER_LEASE_NAME
              value: "nexcom-matching-engine-leader"
            - name: LEADER_LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: nexcom-engine-config
            - secretRef:
                name: nexcom-engine-secrets

          # ── Health probes ────────────────────────────────────────────────────
          # Startup: give the engine 60s to replay Kafka and warm the order book
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 12 × 5s = 60s max startup
            successThreshold: 1

          # Liveness: restart if the engine hangs or deadlocks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          # Readiness: remove from Service LB if not accepting orders
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 2
            successThreshold: 1
            timeoutSeconds: 3

          # ── Resources ────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # ── Lifecycle: drain orders before shutdown ──────────────────────────
          lifecycle:
            preStop:
              exec:
                # Signal the engine to stop accepting new orders and drain
                command: ["/bin/sh", "-c", "curl -s -X POST http://localhost:8080/admin/drain && sleep 25"]

          # ── Security context ─────────────────────────────────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: engine-data
              mountPath: /data

      volumes:
        - name: tmp
          emptyDir: {}
        - name: engine-data
          emptyDir:
            medium: Memory
            sizeLimit: "512Mi"

      # ── Priority: matching engine is critical infrastructure ─────────────────
      priorityClassName: nexcom-critical

---
# ── Service: ClusterIP with session affinity for order routing ────────────────
apiVersion: v1
kind: Service
metadata:
  name: nexcom-matching-engine
  namespace: nexcom-engines
  labels:
    app: nexcom-matching-engine
    app.kubernetes.io/part-of: nexcom-exchange
spec:
  selector:
    app: nexcom-matching-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  # ClientIP affinity ensures a client always hits the same pod
  # (important for order-book subscriptions / WebSocket)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
# ── Headless Service: for direct pod-to-pod leader election ──────────────────
apiVersion: v1
kind: Service
metadata:
  name: nexcom-matching-engine-headless
  namespace: nexcom-engines
  labels:
    app: nexcom-matching-engine
spec:
  clusterIP: None
  selector:
    app: nexcom-matching-engine
  ports:
    - name: http
      port: 8080
      targetPort: http

---
# ── PodDisruptionBudget: always keep ≥2 replicas during node drains ──────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexcom-matching-engine-pdb
  namespace: nexcom-engines
  labels:
    app.kubernetes.io/part-of: nexcom-exchange
spec:
  # During voluntary disruptions (node drain, rolling update),
  # at most 1 replica may be unavailable at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: nexcom-matching-engine

---
# ── PriorityClass: matching engine pods preempt non-critical workloads ────────
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nexcom-critical
value: 1000000
globalDefault: false
description: "NEXCOM critical exchange infrastructure — preempts all non-critical pods"
