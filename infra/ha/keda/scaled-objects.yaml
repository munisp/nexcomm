  name: trading-engine-scaledobject
  namespace: nexcom
  labels:
    app: trading-engine
spec:
  scaleTargetRef:
    name: trading-engine
  pollingInterval: 10
  cooldownPeriod: 90
  minReplicaCount: 2
  maxReplicaCount: 12
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
  triggers:
    - type: kafka
      authenticationRef:
        name: kafka-trigger-auth
      metadata:
        bootstrapServers: ""
        consumerGroup: nexcom-trading-engine
        topic: trades.pending
        lagThreshold: "300"
        activationLagThreshold: "10"
        offsetResetPolicy: latest
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

---
# ─── Risk Management ──────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: risk-management-scaledobject
  namespace: nexcom
  labels:
    app: risk-management
spec:
  scaleTargetRef:
    name: risk-management
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 8
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 20
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 240
          policies:
            - type: Pods
              value: 1
              periodSeconds: 90
  triggers:
    - type: kafka
      authenticationRef:
        name: kafka-trigger-auth
      metadata:
        bootstrapServers: ""
        consumerGroup: nexcom-risk-management
        topic: risk.checks
        lagThreshold: "200"
        activationLagThreshold: "5"
        offsetResetPolicy: latest
    - type: redis
      authenticationRef:
        name: redis-trigger-auth
      metadata:
        address: ""
        listName: nexcom:risk_queue
        listLength: "100"
        activationListLength: "5"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
