---
# ═══════════════════════════════════════════════════════════════════════════════
# NEXCOM Exchange — Prometheus ServiceMonitors for all 5 engine services
#
# Prerequisites:
#   - Prometheus Operator (kube-prometheus-stack) installed
#   - Each engine exposes /metrics on its service port
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Matching Engine ──────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: matching-engine-monitor
  namespace: nexcom
  labels:
    app: matching-engine
    release: kube-prometheus-stack   # must match Prometheus operator's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: matching-engine
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
  namespaceSelector:
    matchNames:
      - nexcom

