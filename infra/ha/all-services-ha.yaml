---
# =============================================================================
# NEXCOM Exchange — Kubernetes HA Manifests for All 22 Services
# =============================================================================
# Applies: Deployment (3 replicas), HPA (3-10 replicas), PodDisruptionBudget
# Namespace: nexcom-production
# Strategy: RollingUpdate with maxSurge=1, maxUnavailable=0 (zero-downtime)
# =============================================================================

# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: nexcom-production
  labels:
    app.kubernetes.io/part-of: nexcom-exchange
    environment: production

---
# =============================================================================
# CORE BANKING SERVICE (Go)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking
  namespace: nexcom-production
  labels:
    app: core-banking
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-banking
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: core-banking
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: [core-banking]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: core-banking
        image: nexcom/core-banking:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nexcom-secrets
              key: DATABASE_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: nexcom-config
              key: KAFKA_BROKERS
        - name: PORT
          value: "8080"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-banking-hpa
  namespace: nexcom-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-banking
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-banking-pdb
  namespace: nexcom-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: core-banking

