---
# NEXCOM Grafana OnCall — Webhook Token Auto-Wiring Job
# Automatically retrieves the Grafana OnCall webhook integration token
# and patches the Wazuh alert integration secret so alerting is fully
# activated without any manual steps.
#
# Run after the full stack is deployed:
#   kubectl apply -f infra/security/grafana-oncall/
#   kubectl wait --for=condition=ready pod -l app=grafana -n nexcom-security --timeout=120s
#   kubectl apply -f infra/security/grafana-oncall/07-oncall-token-wiring-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: oncall-token-wiring
  namespace: nexcom-security
  labels:
    app: oncall-token-wiring
    component: security
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: oncall-token-wiring
    spec:
      restartPolicy: OnFailure
      serviceAccountName: oncall-token-wiring-sa
      containers:
        - name: token-wiring
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install requests kubernetes --quiet
              python3 /scripts/wire-token.py
          env:
            - name: GRAFANA_URL
              value: "http://grafana.nexcom-security.svc.cluster.local:3000"
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: WAZUH_SECRET_NAME
              value: "wazuh-oncall-token"
            - name: WAZUH_NAMESPACE
              value: "nexcom-security"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: oncall-token-wiring-script
            defaultMode: 0755
---
# The Python script that wires the token
apiVersion: v1
kind: ConfigMap
metadata:
  name: oncall-token-wiring-script
  namespace: nexcom-security
data:
  wire-token.py: |
    #!/usr/bin/env python3
    """
    Grafana OnCall Token Auto-Wiring Script
    ========================================
    1. Authenticates to Grafana
    2. Creates or retrieves the Wazuh webhook integration in OnCall
    3. Extracts the integration token
    4. Patches the Kubernetes Secret 'wazuh-oncall-token' with the real token
    5. Triggers a Wazuh manager reload to pick up the new token
    """
    import base64
    import json
    import os
    import sys
    import time
    import requests
    from kubernetes import client as k8s_client, config as k8s_config

    GRAFANA_URL = os.environ["GRAFANA_URL"]
    GRAFANA_USER = os.environ["GRAFANA_USER"]
    GRAFANA_PASSWORD = os.environ["GRAFANA_PASSWORD"]
    SECRET_NAME = os.environ["WAZUH_SECRET_NAME"]
    SECRET_NAMESPACE = os.environ["WAZUH_NAMESPACE"]

    session = requests.Session()
    session.auth = (GRAFANA_USER, GRAFANA_PASSWORD)
    session.headers.update({"Content-Type": "application/json"})

    def wait_for_grafana():
        print("Waiting for Grafana to be ready...")
        for i in range(30):
            try:
                r = session.get(f"{GRAFANA_URL}/api/health", timeout=5)
                if r.status_code == 200:
                    print(f"Grafana ready: {r.json()}")
                    return True
            except Exception as e:
                print(f"  Attempt {i+1}/30: {e}")
            time.sleep(5)
        return False

    def get_or_create_oncall_integration():
        """Get or create the Wazuh webhook integration in Grafana OnCall."""
        # List existing integrations
        r = session.get(f"{GRAFANA_URL}/api/plugins/grafana-oncall-app/resources/api/v1/integrations/")
        if r.status_code != 200:
            print(f"OnCall API error: {r.status_code} {r.text}")
            # Try the direct OnCall API endpoint
            r = session.get(f"{GRAFANA_URL}/api/v1/integrations/")
            if r.status_code != 200:
                raise RuntimeError(f"Cannot reach OnCall API: {r.status_code}")

        integrations = r.json().get("results", r.json() if isinstance(r.json(), list) else [])
        for integration in integrations:
            if integration.get("name") == "NEXCOM-Wazuh-Alerts":
                print(f"Found existing integration: {integration['id']}")
                return integration

        # Create new Wazuh webhook integration
        payload = {
            "type": "webhook",
            "name": "NEXCOM-Wazuh-Alerts",
            "team_id": None,
        }
        r = session.post(
            f"{GRAFANA_URL}/api/plugins/grafana-oncall-app/resources/api/v1/integrations/",
            json=payload,
        )
        if r.status_code not in (200, 201):
            raise RuntimeError(f"Failed to create integration: {r.status_code} {r.text}")
        integration = r.json()
        print(f"Created new integration: {integration['id']}")
        return integration

    def extract_token(integration):
        """Extract the webhook token from the integration URL."""
        link = integration.get("link", "")
        # URL format: https://oncall.../integrations/v1/webhook/<TOKEN>/
        parts = [p for p in link.split("/") if p]
        if parts:
            token = parts[-1]
            print(f"Extracted token: {token[:8]}...")
            return token
        # Fallback: use the integration ID as token
        return integration.get("id", "")

    def patch_k8s_secret(token):
        """Patch the Kubernetes Secret with the real OnCall webhook token."""
        try:
            k8s_config.load_incluster_config()
        except Exception:
            k8s_config.load_kube_config()

        v1 = k8s_client.CoreV1Api()
        token_b64 = base64.b64encode(token.encode()).decode()

        try:
            secret = v1.read_namespaced_secret(SECRET_NAME, SECRET_NAMESPACE)
            secret.data["ONCALL_WEBHOOK_TOKEN"] = token_b64
            v1.replace_namespaced_secret(SECRET_NAME, SECRET_NAMESPACE, secret)
            print(f"Updated secret {SECRET_NAME} in namespace {SECRET_NAMESPACE}")
        except k8s_client.exceptions.ApiException as e:
            if e.status == 404:
                # Create the secret
                secret = k8s_client.V1Secret(
                    metadata=k8s_client.V1ObjectMeta(
                        name=SECRET_NAME,
                        namespace=SECRET_NAMESPACE,
                    ),
                    data={"ONCALL_WEBHOOK_TOKEN": token_b64},
                )
                v1.create_namespaced_secret(SECRET_NAMESPACE, secret)
                print(f"Created secret {SECRET_NAME} in namespace {SECRET_NAMESPACE}")
            else:
                raise

    def main():
        if not wait_for_grafana():
            print("ERROR: Grafana did not become ready in time")
            sys.exit(1)

        print("Retrieving OnCall webhook integration...")
        integration = get_or_create_oncall_integration()
        token = extract_token(integration)

        if not token:
            print("ERROR: Could not extract webhook token")
            sys.exit(1)

        print("Patching Kubernetes secret with OnCall webhook token...")
        patch_k8s_secret(token)

        print("SUCCESS: Grafana OnCall webhook token wired to Wazuh integration")
        print(f"  Integration ID: {integration.get('id')}")
        print(f"  Integration URL: {integration.get('link', 'N/A')}")
        print(f"  Secret: {SECRET_NAME}/{SECRET_NAMESPACE}")
        print("")
        print("Next: Restart the Wazuh manager to pick up the new token:")
        print("  kubectl rollout restart deployment/wazuh-manager -n nexcom-security")

    if __name__ == "__main__":
        main()
---
# ServiceAccount with permissions to patch secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-token-wiring-sa
  namespace: nexcom-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oncall-token-wiring-role
  namespace: nexcom-security
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/rollout"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oncall-token-wiring-rolebinding
  namespace: nexcom-security
subjects:
  - kind: ServiceAccount
    name: oncall-token-wiring-sa
    namespace: nexcom-security
roleRef:
  kind: Role
  name: oncall-token-wiring-role
  apiGroup: rbac.authorization.k8s.io
