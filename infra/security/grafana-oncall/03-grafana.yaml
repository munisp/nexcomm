---
# =============================================================================
# NEXCOM — Grafana with OnCall Plugin
# Grafana serves as the UI for OnCall, Prometheus, and Wazuh dashboards
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: monitoring
type: Opaque
stringData:
  # Grafana admin credentials — change before production deployment
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "nexcom_grafana_2026_t-QlvM07HIY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [server]
    root_url = https://grafana.nexcom.exchange
    serve_from_sub_path = false

    [database]
    type = postgres
    host = grafana-oncall-postgres.monitoring.svc.cluster.local:5432
    name = grafana
    user = oncall
    password = EBKx-_IbydQqSdswF86m_Wypknf-fBLf

    [auth]
    disable_login_form = false
    oauth_auto_login = false

    [plugins]
    allow_loading_unsigned_plugins = grafana-oncall-app

    [feature_toggles]
    enable = ngalert

    [unified_alerting]
    enabled = true

    [alerting]
    enabled = false

    [log]
    level = warn

    [analytics]
    reporting_enabled = false
    check_for_updates = false

  provisioning-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false
      - name: Wazuh-Elasticsearch
        type: elasticsearch
        url: http://wazuh-indexer.wazuh.svc.cluster.local:9200
        access: proxy
        database: "wazuh-alerts-*"
        jsonData:
          timeField: "@timestamp"
          esVersion: "8.0.0"
        editable: false

  provisioning-plugins.yaml: |
    apiVersion: 1
    apps:
      - type: grafana-oncall-app
        org_id: 1
        disabled: false
        jsonData:
          stackId: "nexcom"
          onCallApiUrl: "http://grafana-oncall.monitoring.svc.cluster.local:8080"
          grafanaUrl: "https://grafana.nexcom.exchange"
          license: "OSS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: nexcom-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      initContainers:
        # Install Grafana OnCall plugin before starting
        - name: install-oncall-plugin
          image: grafana/grafana:10.4.0
          command:
            - sh
            - -c
            - |
              grafana-cli --pluginsDir /var/lib/grafana/plugins plugins install grafana-oncall-app || true
              grafana-cli --pluginsDir /var/lib/grafana/plugins plugins install grafana-piechart-panel || true
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: grafana-secret
          env:
            - name: GF_INSTALL_PLUGINS
              value: "grafana-oncall-app,grafana-piechart-panel"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: provisioning-datasources.yaml
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/plugins/plugins.yaml
              subPath: provisioning-plugins.yaml
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-config
          configMap:
            name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# ─── Ingress for Grafana (HTTPS) ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - grafana.nexcom.exchange
      secretName: grafana-tls
  rules:
    - host: grafana.nexcom.exchange
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# ─── Ingress for Grafana OnCall webhooks (public endpoint for Wazuh) ──────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-oncall-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate-limit webhook endpoint to prevent abuse
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - oncall.nexcom.exchange
      secretName: oncall-tls
  rules:
    - host: oncall.nexcom.exchange
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-oncall
                port:
                  number: 8080
