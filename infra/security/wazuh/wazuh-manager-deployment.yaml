---
# =============================================================================
# NEXCOM Commodity Exchange — Wazuh Manager Deployment
# SIEM, IDS, and ISO 27001 compliance monitoring
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: wazuh
  labels:
    app.kubernetes.io/part-of: nexcom-security
    pod-security.kubernetes.io/enforce: restricted

---
# PersistentVolumeClaim: Wazuh Manager data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wazuh-manager-data
  namespace: wazuh
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 50Gi

---
# PersistentVolumeClaim: Wazuh Manager logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wazuh-manager-logs
  namespace: wazuh
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi

---
# StatefulSet: Wazuh Manager
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app: wazuh-manager
    app.kubernetes.io/part-of: nexcom-security
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
        app.kubernetes.io/part-of: nexcom-security
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
    spec:
      serviceAccountName: wazuh-manager-sa
      securityContext:
        runAsNonRoot: false  # Wazuh requires root for syscall monitoring
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 1000:1000 /var/ossec/data /var/ossec/logs']
          volumeMounts:
            - name: wazuh-manager-data
              mountPath: /var/ossec/data
            - name: wazuh-manager-logs
              mountPath: /var/ossec/logs
          securityContext:
            runAsUser: 0
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: agents
              containerPort: 1514
              protocol: UDP
            - name: agents-tcp
              containerPort: 1514
              protocol: TCP
            - name: cluster
              containerPort: 1516
              protocol: TCP
            - name: api
              containerPort: 55000
              protocol: TCP
          env:
            - name: WAZUH_MANAGER_CONF
              value: /etc/wazuh-manager/ossec.conf
            - name: INDEXER_URL
              value: https://wazuh-indexer-service:9200
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-credentials
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-indexer-credentials
                  key: password
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: full
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /etc/ssl/root-ca.pem
            - name: SSL_CERTIFICATE
              value: /etc/ssl/filebeat.pem
            - name: SSL_KEY
              value: /etc/ssl/filebeat-key.pem
          volumeMounts:
            - name: wazuh-manager-data
              mountPath: /var/ossec/data
            - name: wazuh-manager-logs
              mountPath: /var/ossec/logs
            - name: wazuh-config
              mountPath: /etc/wazuh-manager
              readOnly: true
            - name: wazuh-tls
              mountPath: /etc/ssl
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /
              port: 55000
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 55000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: wazuh-manager-data
          persistentVolumeClaim:
            claimName: wazuh-manager-data
        - name: wazuh-manager-logs
          persistentVolumeClaim:
            claimName: wazuh-manager-logs
        - name: wazuh-config
          configMap:
            name: wazuh-manager-config
        - name: wazuh-tls
          secret:
            secretName: wazuh-tls-secret

---
# Service: Wazuh Manager
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager-service
  namespace: wazuh
  labels:
    app: wazuh-manager
spec:
  type: ClusterIP
  selector:
    app: wazuh-manager
  ports:
    - name: agents-udp
      port: 1514
      targetPort: 1514
      protocol: UDP
    - name: agents-tcp
      port: 1515
      targetPort: 1514
      protocol: TCP
    - name: cluster
      port: 1516
      targetPort: 1516
      protocol: TCP
    - name: api
      port: 55000
      targetPort: 55000
      protocol: TCP

---
# ServiceAccount: Wazuh Manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-manager-sa
  namespace: wazuh
