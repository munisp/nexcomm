name: EAS Build & Submit

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Type-check and lint on every PR/push
  # ─────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────
  # Preview build — triggered on PRs and pushes to main
  # ─────────────────────────────────────────────────────────────────
  build-preview:
    name: Preview Build (Internal Distribution)
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK (preview)
        run: eas build --platform android --profile preview --non-interactive

      - name: Build iOS (preview, simulator)
        run: eas build --platform ios --profile preview --non-interactive

  # ─────────────────────────────────────────────────────────────────
  # Production build — triggered on version tags (v*)
  # ─────────────────────────────────────────────────────────────────
  build-production:
    name: Production Build
    runs-on: ubuntu-latest
    needs: typecheck
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android AAB (production)
        run: eas build --platform android --profile production --non-interactive

      - name: Build iOS (production)
        run: eas build --platform ios --profile production --non-interactive

  # ─────────────────────────────────────────────────────────────────
  # Submit to stores — runs after successful production build
  # ─────────────────────────────────────────────────────────────────
  submit:
    name: Submit to App Stores
    runs-on: ubuntu-latest
    needs: build-production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play
        run: eas submit --platform android --profile production --non-interactive

      - name: Submit to App Store Connect
        run: eas submit --platform ios --profile production --non-interactive

  # ─────────────────────────────────────────────────────────────────
  # OTA Update — publish JS bundle update without a full build
  # ─────────────────────────────────────────────────────────────────
  ota-update:
    name: OTA Update (Expo Updates)
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to preview channel
        run: eas update --channel preview --message "Auto-update from main branch ${{ github.sha }}"
