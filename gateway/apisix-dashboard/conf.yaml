# NEXCOM Exchange — APISIX Dashboard Configuration
conf:
  listen:
    host: 0.0.0.0  # Docker port mapping is bound to 127.0.0.1 in the management profile
    port: 9000
  allow_list:
    - 127.0.0.1/32  # Dashboard access is limited to local operator traffic
  etcd:
    endpoints:
      - "apisix:2379"  # Uses APISIX's embedded etcd in standalone mode
    mtls:
      key_file: ""
      cert_file: ""
      ca_file: ""
    prefix: /apisix
    timeout: 30
  log:
    error_log:
      level: warn
      file_path: logs/error.log
    access_log:
      file_path: logs/access.log
  security:
    content_security_policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    x_frame_options: "SAMEORIGIN"
    x_content_type_options: nosniff

authentication:
  # Values are supplied only by the management-profile deployment environment.
  # Do not replace these with repository defaults.
  secret: ${APISIX_DASHBOARD_JWT_SECRET:?APISIX_DASHBOARD_JWT_SECRET is required}
  expire_time: 3600
  users:
    - username: ${APISIX_DASHBOARD_ADMIN_USERNAME:?APISIX_DASHBOARD_ADMIN_USERNAME is required}
      password: ${APISIX_DASHBOARD_ADMIN_PASSWORD:?APISIX_DASHBOARD_ADMIN_PASSWORD is required}

plugins:
  - api-breaker
  - authz-keycloak
  - basic-auth
  - batch-requests
  - consumer-restriction
  - cors
  - echo
  - fault-injection
  - grpc-transcode
  - hmac-auth
  - http-logger
  - ip-restriction
  - jwt-auth
  - kafka-logger
  - key-auth
  - limit-conn
  - limit-count
  - limit-req
  - node-status
  - openid-connect
  - prometheus
  - proxy-cache
  - proxy-mirror
  - proxy-rewrite
  - redirect
  - referer-restriction
  - request-id
  - request-validation
  - response-rewrite
  - serverless-post-function
  - serverless-pre-function
  - syslog
  - tcp-logger
  - traffic-split
  - udp-logger
  - uri-blocker
  - wolf-rbac
  - zipkin
