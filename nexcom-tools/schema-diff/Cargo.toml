[package]
name = "schema-diff"
version = "0.1.0"
edition = "2021"
description = "NEXCOM Exchange — PostgreSQL schema drift validator"

[[bin]]
name = "schema-diff"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
anyhow = "1"
