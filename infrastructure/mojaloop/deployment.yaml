##############################################################################
# NEXCOM Exchange - Mojaloop Integration Deployment
# Open-source payment interoperability for settlement and clearing
# Based on Mojaloop's Level One Project for financial inclusion
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-adapter
  namespace: nexcom-infra
  labels:
    app: mojaloop-adapter
    app.kubernetes.io/part-of: nexcom-exchange
    tier: settlement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mojaloop-adapter
  template:
    metadata:
      labels:
        app: mojaloop-adapter
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-adapter"
        dapr.io/app-port: "4001"
    spec:
      containers:
        - name: mojaloop-adapter
          image: nexcom/mojaloop-adapter:latest
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: MOJALOOP_HUB_URL
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-config
                  key: hub-url
            - name: MOJALOOP_ALS_URL
              valueFrom:
                configMapKeyRef:
                  name: mojaloop-config
                  key: als-url
            - name: TIGERBEETLE_ADDRESS
              value: "tigerbeetle:3001"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-adapter
  namespace: nexcom-infra
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: 4001
      protocol: TCP
      name: http
  selector:
    app: mojaloop-adapter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mojaloop-config
  namespace: nexcom-infra
data:
  hub-url: "http://central-ledger:3001"
  als-url: "http://account-lookup-service:4002"
  # Mojaloop FSPIOP API version
  fspiop-version: "1.1"
  # Settlement model: DEFERRED_NET or IMMEDIATE_GROSS
  settlement-model: "IMMEDIATE_GROSS"
  # NEXCOM as a DFSP (Digital Financial Service Provider)
  dfsp-id: "nexcom-exchange"
  # Callback URLs for Mojaloop hub notifications
  callback-url: "http://mojaloop-adapter:4001/callbacks"
  # Currency support
  supported-currencies: "USD,EUR,GBP,NGN,KES,GHS,ZAR"
