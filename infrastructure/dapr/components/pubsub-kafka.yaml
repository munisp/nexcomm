##############################################################################
# NEXCOM Exchange - Dapr Pub/Sub Component (Kafka)
# Event-driven communication between microservices
##############################################################################
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: nexcom-pubsub
  namespace: nexcom
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka:9092"
    - name: consumerGroup
      value: "nexcom-services"
    - name: clientID
      value: "nexcom-dapr"
    - name: authType
      value: "none"
    - name: maxMessageBytes
      value: "1048576"
    - name: consumeRetryInterval
      value: "200ms"
    - name: version
      value: "3.7.0"
    - name: disableTls
      value: "true"
scopes:
  - trading-engine
  - market-data
  - risk-management
  - settlement
  - user-management
  - notification
  - ai-ml
  - blockchain
