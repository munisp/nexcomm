##############################################################################
# NEXCOM Exchange - Market Data Service Kubernetes Deployment
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: nexcom
  labels:
    app: market-data
    app.kubernetes.io/part-of: nexcom-exchange
    tier: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "market-data"
        dapr.io/app-port: "8002"
    spec:
      containers:
        - name: market-data
          image: nexcom/market-data:latest
          ports:
            - containerPort: 8002
              name: http
            - containerPort: 8003
              name: websocket
          env:
            - name: PORT
              value: "8002"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: nexcom-db-secret
                  key: connection-string
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: nexcom
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
    - port: 8003
      targetPort: 8003
      name: websocket
  selector:
    app: market-data
