# --- Blockchain Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: nexcom
  labels:
    app: blockchain
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "blockchain"
        dapr.io/app-port: "8009"
    spec:
      containers:
        - name: blockchain
          image: nexcom/blockchain:latest
          ports:
            - containerPort: 8009
          env:
            - name: PORT
              value: "8009"
            - name: ETHEREUM_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: nexcom-blockchain-secret
                  key: ethereum-rpc-url
            - name: POLYGON_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: nexcom-blockchain-secret
                  key: polygon-rpc-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8009
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain
  namespace: nexcom
spec:
  type: ClusterIP
  ports:
    - port: 8009
      targetPort: 8009
  selector:
    app: blockchain
