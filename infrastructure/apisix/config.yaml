##############################################################################
# NEXCOM Exchange - Apache APISIX Configuration
# API Gateway with rate limiting, authentication, and routing
##############################################################################

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

deployment:
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: nexcom-admin-key-changeme
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: "0.0.0.0"
      port: 9091

plugins:
  # Authentication
  - key-auth
  - jwt-auth
  - openid-connect
  - basic-auth
  - hmac-auth

  # Security
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - consumer-restriction

  # Traffic Control
  - limit-req
  - limit-count
  - limit-conn
  - traffic-split

  # Observability
  - prometheus
  - zipkin
  - opentelemetry
  - http-logger
  - kafka-logger

  # Transformation
  - proxy-rewrite
  - response-rewrite
  - grpc-transcode
  - grpc-web

  # General
  - redirect
  - echo
  - gzip
  - real-ip
  - ext-plugin-pre-req
  - ext-plugin-post-resp

  # Rate limiting for exchange API
  - api-breaker
