##############################################################################
# NEXCOM Exchange - APISIX Routes & Upstreams (Declarative)
# All API traffic routes through the Go Gateway as the primary API layer.
# APISIX provides edge-level rate limiting, WAF, and Kafka logging.
##############################################################################

routes:
  # --------------------------------------------------------------------------
  # Primary Gateway Route — all /api/v1/* traffic goes to Go Gateway
  # --------------------------------------------------------------------------
  - uri: /api/v1/*
    name: gateway-primary
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    upstream_id: gateway
    plugins:
      openid-connect:
        client_id: nexcom-api
        client_secret: "${KEYCLOAK_CLIENT_SECRET}"
        discovery: "http://keycloak:8080/realms/nexcom/.well-known/openid-configuration"
        bearer_only: true
        scope: "openid"
      limit-count:
        count: 5000
        time_window: 60
        key_type: "var"
        key: "remote_addr"
        rejected_code: 429
      cors:
        allow_origins: "**"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-ID"
        max_age: 3600
      kafka-logger:
        broker_list:
          kafka:
            host: "kafka"
            port: 9092
        kafka_topic: "nexcom-api-logs"
        batch_max_size: 100

  # --------------------------------------------------------------------------
  # Auth Routes (public, no OIDC)
  # --------------------------------------------------------------------------
  - uri: /api/v1/auth/*
    name: auth-public
    methods: ["POST"]
    upstream_id: gateway
    priority: 10
    plugins:
      limit-count:
        count: 30
        time_window: 60
        key_type: "var"
        key: "remote_addr"
        rejected_code: 429

  # --------------------------------------------------------------------------
  # WebSocket Route — real-time market data via Gateway
  # --------------------------------------------------------------------------
  - uri: /ws/v1/*
    name: gateway-websocket
    upstream_id: gateway
    enable_websocket: true

  # --------------------------------------------------------------------------
  # Health Check (public, no auth)
  # --------------------------------------------------------------------------
  - uri: /health
    name: health-check
    methods: ["GET"]
    upstream_id: gateway
    plugins: {}

# ============================================================================
# Upstreams — single primary: Go Gateway handles all routing
# ============================================================================
upstreams:
  - id: gateway
    type: roundrobin
    nodes:
      "gateway:8000": 1
    checks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3

#END
