# NEXCOM Exchange — Docker Compose Override
#
# Extends docker-compose.yml with:
#   1. Keycloak — auto-imports the nexcom realm on first boot
#   2. MinIO — object storage for file uploads (replaces Manus forge storage)
#   3. minio-init — one-shot container that creates the nexcom-files bucket
#
# Usage:
#   docker compose up -d          ← automatically merges this file
#   docker compose -f docker-compose.yml up -d  ← skips this file
#
# Required env vars (set in .env or shell):
#   KEYCLOAK_ADMIN_PASSWORD   default: nexcom-admin-secret
#   MINIO_ROOT_USER           default: nexcom-minio
#   MINIO_ROOT_PASSWORD       default: nexcom-minio-secret
#   POSTGRES_PASSWORD         default: nexcom_dev  (from docker-compose.yml)

version: "3.9"

services:

  # ─── Keycloak Identity Provider ──────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: nexcom-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-nexcom-admin-secret}
      # Database backend (reuse the existing PostgreSQL service)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nexcom
      KC_DB_USERNAME: nexcom
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-nexcom_dev}
      KC_DB_SCHEMA: keycloak
      # HTTP settings
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: INFO
    volumes:
      # Mount the realm JSON — Keycloak imports it on first boot (idempotent)
      - ./infra/keycloak/nexcom-realm.json:/opt/keycloak/data/import/nexcom-realm.json:ro
    ports:
      - "8080:8080"
    networks: [nexcom]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ─── MinIO Object Storage ─────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: nexcom-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexcom-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexcom-minio-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    networks: [nexcom]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ─── MinIO bucket initialisation (runs once, then exits) ─────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: nexcom-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [nexcom]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-nexcom-minio} $${MINIO_ROOT_PASSWORD:-nexcom-minio-secret};
        mc mb --ignore-existing local/nexcom-files;
        mc mb --ignore-existing local/nexcom-kyc;
        mc mb --ignore-existing local/nexcom-reports;
        mc anonymous set download local/nexcom-files;
        echo 'MinIO buckets ready.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexcom-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexcom-minio-secret}
    restart: "no"

  # ─── NEXCOM app — inject MinIO + Keycloak env vars ───────────────────────
  nexcom-app:
    environment:
      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nexcom-files
      S3_PUBLIC_BASE_URL: http://localhost:9000/nexcom-files
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-nexcom-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-nexcom-minio-secret}
      # Keycloak OIDC
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: nexcom
      KEYCLOAK_CLIENT_ID: nexcom-exchange
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-nexcom-exchange-secret}
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
