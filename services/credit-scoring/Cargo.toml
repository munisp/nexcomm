[package]
name = "credit-scoring"
version = "1.0.0"
edition = "2021"
description = "NEXCOM Exchange — High-performance credit scoring engine (Rust)"

[[bin]]
name = "credit-scoring"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
# reqwest 0.13 renamed its TLS features: `rustls-tls` no longer exists.
# `rustls` (aws-lc-rs provider + rustls-platform-verifier) is the 0.13
# equivalent; default-features=false avoids also pulling in native-tls/openssl.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
redis = { version = "1.4", features = ["tokio-comp"] }

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
