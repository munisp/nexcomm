[package]
name = "crypto-guard"
version = "0.1.0"
edition = "2021"
description = "NEXCOM Exchange — Cryptographic Security Service"

[[bin]]
name = "crypto-guard"
path = "src/main.rs"

[dependencies]
# HTTP server
actix-web = "4"
actix-rt = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1", features = ["full"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Config
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
