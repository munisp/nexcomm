# NEXCOM Exchange — Unified Docker Compose
# Runs all platform services together for local development and staging.
# Usage: docker compose up -d
# Production: use deployment/kubernetes/ manifests instead.

version: "3.9"

networks:
  nexcom:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  tigerbeetle_data:
  lakehouse_data:        # Shared Delta Lake / Parquet storage for Bronze/Silver/Gold layers
  mojaloop_mysql_data:   # Mojaloop Central Hub MySQL data (hub-internal, separate from NEXCOM PostgreSQL)
  opensearch_data:       # OpenSearch full-text search index
  temporal_data:         # Temporal workflow persistence (PostgreSQL-backed)
  permify_data:          # Permify RBAC policy store
  apisix_data:           # APISIX etcd config store
  model_registry_data:   # AI/ML model registry — persists trained scikit-learn models
  appsec_data:           # open-appsec agent data (waf profile)
  appsec_logs:           # open-appsec agent logs (waf profile)
  backup_data:           # Postgres/lakehouse backup dumps (backup profile)
  mlflow_data:           # MLflow tracking server state (ml profile)
  neo4j_data:            # Neo4j graph store (ml profile)

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexcom
      POSTGRES_USER: nexcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/00-keycloak-schema.sql:/docker-entrypoint-initdb.d/00-keycloak-schema.sql:ro
    ports:
      - "5432:5432"
    networks: [nexcom]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexcom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [nexcom]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [nexcom]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    networks: [nexcom]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ─── Fluvio Streaming Bridge ───────────────────────────────────────────────
  # HTTP bridge in front of Fluvio used by the portal (server/fluvio/fluvioClient.ts),
  # gateway-service (internal/fluvio/client.go) and journey-orchestrator.
  # Works standalone: when no Fluvio SC cluster is reachable it serves traffic
  # from in-memory fallback queues (see fluvio-sidecar/main.py).
  fluvio-sidecar:
    build:
      context: ./fluvio-sidecar
      dockerfile: Dockerfile
    container_name: nexcom-fluvio-sidecar
    environment:
      FLUVIO_SIDECAR_PORT: "8090"
      # Fluvio SC endpoint; the optional `fluvio` profile service below provides
      # it in-cluster. Unreachable SC => automatic in-memory fallback mode.
      FLUVIO_ENDPOINT: ${FLUVIO_SC_ENDPOINT:-fluvio:9003}
    ports:
      - "8090:8090"
    healthcheck:
      # python:3.11-slim has no curl/wget — use stdlib urllib
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nexcom]

  # Optional local Fluvio SC cluster (opt-in: docker compose --profile fluvio up).
  # Dev-grade only (single SPU, in-container local cluster); production uses
  # the k8s manifests under infrastructure/fluvio/.
  fluvio:
    image: infinyon/fluvio:0.11.11
    container_name: nexcom-fluvio-sc
    profiles: ["fluvio"]
    command: ["fluvio", "cluster", "start", "--local", "--spu", "1"]
    ports:
      - "9003:9003"
    networks: [nexcom]

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.73
    command: >
      sh -c "tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle 2>/dev/null || true
             tigerbeetle start --addresses=0.0.0.0:3001 /data/0_0.tigerbeetle"
    volumes:
      - tigerbeetle_data:/data
    ports:
      - "3001:3001"
    # TigerBeetle has no HTTP endpoint and the image ships no curl; the tb
    # binary itself is the probe — `version` exercises the binary in-image.
    # Consumers should additionally gate on gateway-service health (which wraps
    # the official TB SDK Nop() probe).
    healthcheck:
      test: ["CMD-SHELL", "tigerbeetle version >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [nexcom]

  # ─── Identity Provider ────────────────────────────────────────────────────

  keycloak:
    build:
      context: ./infra/keycloak
      dockerfile: Dockerfile
    container_name: nexcom-keycloak
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --health-enabled=true
      - --metrics-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nexcom
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: nexcom
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infra/keycloak/nexcom-realm.json:/opt/keycloak/data/import/nexcom-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [nexcom]

  # ─── Core Exchange Services ────────────────────────────────────────────────

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      MATCHING_ENGINE_URL: http://matching-engine:8080
      SETTLEMENT_ENGINE_URL: http://settlement-engine:8005
      GATEWAY_URL: http://gateway:8200
      RISK_SERVICE_URL: http://risk-management:8004
      KYC_SERVICE_URL: http://kyc-service:8003
      NOTIFICATION_SERVICE_URL: http://notification:8008
      ANALYTICS_SERVICE_URL: http://analytics:8006
      USER_MANAGEMENT_URL: http://user-management:8012
      MOJALOOP_ADAPTER_URL: http://mojaloop-adapter:4001
      AI_ML_SERVICE_URL: http://ai-ml:8007
      AIML_SERVICE_URL: http://ai-ml:8007
      INGESTION_SERVICE_URL: http://ingestion-engine:8009
      BLOCKCHAIN_SERVICE_URL: http://blockchain:8010
      TIGERBEETLE_ADDRESSES: tigerbeetle:3001
      FLUVIO_HTTP_URL: ${FLUVIO_HTTP_URL:-http://fluvio-sidecar:8090}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-nexcom}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_PORTAL_CLIENT_ID:-nexcom-portal}
      PERMIFY_ENDPOINT: ${PERMIFY_ENDPOINT:-permify:3476}
      PERMIFY_TENANT_ID: ${PERMIFY_TENANT_ID:-t1}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-nexcom}
      DAPR_HTTP_PORT: ${DAPR_HTTP_PORT:-3500}
      DAPR_GRPC_PORT: ${DAPR_GRPC_PORT:-50001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nexcom]

  matching-engine:
    build:
      context: matching-engine
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      # Matching engine publishes to nexcom.order.filled, nexcom.order.cancelled,
      # nexcom.order.placed, nexcom.trade.executed — consumed by ingestion-engine
      # Bronze layer for Lakehouse ingestion
    ports:
      # Host port 18080: 8080 on the host is already claimed by keycloak (L130).
      # Container port stays 8080 — in-network consumers use matching-engine:8080.
      - "18080:8080"
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  settlement-engine:
    build:
      context: settlement-engine
      dockerfile: Dockerfile
    environment:
      PORT: "8005"
      # Ledger ops go through the gateway ledger API (gateway owns the official
      # TigerBeetle SDK client); TB itself has no HTTP interface.
      GATEWAY_URL: http://gateway:8200
      TIGERBEETLE_ADDRESSES: tigerbeetle:3001
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      # Settlement engine publishes to nexcom.settlement.completed,
      # nexcom.settlement.failed, nexcom.payment.processed — consumed by
      # ingestion-engine Bronze layer for Lakehouse ingestion
    ports:
      - "8005:8005"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  gateway:
    build:
      context: gateway-service
      dockerfile: Dockerfile
    environment:
      PORT: "8200"
      MATCHING_ENGINE_URL: http://matching-engine:8080
      SETTLEMENT_ENGINE_URL: http://settlement-engine:8005
      RISK_SERVICE_URL: http://risk-management:8004
      KYC_SERVICE_URL: http://kyc-service:8003
      ANALYTICS_SERVICE_URL: http://analytics:8006
      USER_MANAGEMENT_URL: http://user-management:8012
      MOJALOOP_ADAPTER_URL: http://mojaloop-adapter:4001
      AIML_SERVICE_URL: http://ai-ml:8007
      INGESTION_ENGINE_URL: http://ingestion-engine:8009
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      TIGERBEETLE_ADDRESSES: tigerbeetle:3001
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-nexcom}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-nexcom-gateway}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      PERMIFY_ENDPOINT: ${PERMIFY_ENDPOINT:-permify:3476}
      PERMIFY_TENANT_ID: ${PERMIFY_TENANT_ID:-t1}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-nexcom}
      DAPR_HTTP_PORT: ${DAPR_HTTP_PORT:-3500}
      DAPR_GRPC_PORT: ${DAPR_GRPC_PORT:-50001}
      # gateway-service fluvio client prepends http:// itself — host:port only.
      # Points at the fluvio-sidecar HTTP bridge (fluvio-proxy never existed).
      FLUVIO_ENDPOINT: ${FLUVIO_ENDPOINT:-fluvio-sidecar:8090}
      APISIX_ADMIN_URL: ${APISIX_ADMIN_URL:-http://apisix:9180}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8200:8200"
    depends_on:
      kafka: { condition: service_healthy }
      keycloak: { condition: service_started }
      permify: { condition: service_healthy }
      temporal: { condition: service_healthy }
      dapr-placement: { condition: service_started }
    networks: [nexcom]

  gateway-dapr:
    image: daprio/daprd:1.13.4
    container_name: nexcom-gateway-dapr
    command:
      - ./daprd
      - --app-id=nexcom-gateway
      - --app-port=8200
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --placement-host-address=dapr-placement:50006
      - --components-path=/components
      - --config=/components/config.yaml
      - --log-level=info
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    volumes:
      - ./infra/dapr/components:/components:ro
    depends_on:
      - gateway
      - dapr-placement
      - redis
      - kafka
    network_mode: "service:gateway"

  risk-management:
    build:
      context: services/risk-management
      dockerfile: Dockerfile
    environment:
      PORT: "8004"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
    ports:
      - "8004:8004"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  kyc-service:
    build:
      context: services/kyc-service
      dockerfile: Dockerfile
    environment:
      PORT: "8003"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      NEXCOM_PG_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      REDIS_URL: redis://redis:6379
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY:-}
    ports:
      - "8003:8003"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  notification:
    build:
      context: services/notification
      dockerfile: Dockerfile
    environment:
      PORT: "8008"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  # ─── Data Platform (Lakehouse + AI/ML) ────────────────────────────────────

  ingestion-engine:
    build:
      context: services/ingestion-engine
      dockerfile: Dockerfile
    volumes:
      - lakehouse_data:/data/lakehouse   # Shared Delta Lake storage
    environment:
      PORT: "8009"
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      LAKEHOUSE_BASE_PATH: /data/lakehouse
      # Consumes: nexcom.order.filled, nexcom.order.cancelled, nexcom.order.placed,
      #           nexcom.trade.executed, nexcom.settlement.completed,
      #           nexcom.settlement.failed, nexcom.payment.processed,
      #           nexcom.market.data, nexcom.alternative (sentiment/weather)
      # Writes: Bronze → Silver → Gold Delta Lake tables
    ports:
      - "8009:8009"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8009/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  analytics:
    build:
      context: services/analytics
      dockerfile: Dockerfile
    volumes:
      - lakehouse_data:/data/lakehouse   # Read-only access to Gold layer
    environment:
      PORT: "8006"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      LAKEHOUSE_BASE_PATH: /data/lakehouse
      AIML_SERVICE_URL: http://ai-ml:8007
      INGESTION_ENGINE_URL: http://ingestion-engine:8009
    ports:
      - "8006:8006"
    depends_on:
      postgres: { condition: service_healthy }
      ingestion-engine:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8006/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  ai-ml:
    build:
      context: services/ai-ml
      dockerfile: Dockerfile
    volumes:
      - lakehouse_data:/data/lakehouse   # Read Gold layer feature store
      - model_registry_data:/tmp/nexcom_models  # Persist trained ML models
    environment:
      PORT: "8007"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      LAKEHOUSE_BASE_PATH: /data/lakehouse
      INGESTION_ENGINE_URL: http://ingestion-engine:8009
      # Points at the ml-platform serving API (active with --profile ml)
      ML_PLATFORM_URL: http://ml-platform:8015
    ports:
      - "8007:8007"
    depends_on:
      ingestion-engine:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8007/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  blockchain:
    build:
      context: services/blockchain
      dockerfile: Dockerfile
    environment:
      PORT: "8010"
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  user-management:
    build:
      context: services/user-management
      dockerfile: Dockerfile
    environment:
      PORT: "8012"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8012:8012"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8012/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [nexcom]

  # ─── Mojaloop DFSP Adapter (Go) ───────────────────────────────────────────
  mojaloop-adapter:
    build:
      context: services/mojaloop-adapter
      dockerfile: Dockerfile
    environment:
      PORT: "4001"
      DFSP_ID: "nexcom-exchange"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      MOJALOOP_HUB_URL: ${MOJALOOP_HUB_URL:-http://central-ledger:3001}
      MOJALOOP_ALS_URL: ${MOJALOOP_ALS_URL:-http://account-lookup-service:4002}
      CALLBACK_URL: http://mojaloop-adapter:4001/callbacks
      LOG_LEVEL: info
      DB_MAX_CONNS: "20"
      READ_TIMEOUT_SEC: "30"
      WRITE_TIMEOUT_SEC: "30"
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      central-ledger: { condition: service_healthy }
    networks: [nexcom]

  # ─── Mojaloop Central Hub Services ────────────────────────────────────────
  # NOTE: Mojaloop Central Hub requires MySQL as an upstream dependency.
  # NEXCOM Exchange uses PostgreSQL exclusively for all application data.
  # This MySQL instance is isolated to Mojaloop inter-service communication
  # and is NEVER accessed by NEXCOM application code (portal, routers, services).
  mojaloop-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MOJALOOP_MYSQL_ROOT_PASSWORD:-mojaloop_root}
      MYSQL_USER: mojaloop
      MYSQL_PASSWORD: ${MOJALOOP_MYSQL_PASSWORD:-mojaloop_pass}
      MYSQL_DATABASE: central_ledger
    volumes:
      - mojaloop_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmojaloop_root"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [nexcom]

  central-ledger:
    image: mojaloop/central-ledger:v17.3.3
    environment:
      CLEDGER_DATABASE_URI: mysql://mojaloop:${MOJALOOP_MYSQL_PASSWORD:-mojaloop_pass}@mojaloop-mysql:3306/central_ledger
      CLEDGER_KAFKA_HOST: kafka
      CLEDGER_KAFKA_PORT: "9092"
      LOG_LEVEL: info
      HOSTNAME: central-ledger
    ports:
      # Host port 13001: 3001 on the host is TigerBeetle. In-network consumers use
      # central-ledger:3001 (container port unchanged).
      - "13001:3001"
    depends_on:
      mojaloop-mysql: { condition: service_healthy }
      kafka: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [nexcom]

  ml-api-adapter:
    image: mojaloop/ml-api-adapter:v14.0.5
    environment:
      ML_API_ADAPTER_KAFKA_HOST: kafka
      ML_API_ADAPTER_KAFKA_PORT: "9092"
      ML_API_ADAPTER_CENTRAL_LEDGER_URL: http://central-ledger:3001
      LOG_LEVEL: info
    ports:
      # Host port 13000: 3000 on the host is the portal. In-network refs unchanged.
      - "13000:3000"
    depends_on:
      central-ledger: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [nexcom]

  account-lookup-service:
    image: mojaloop/account-lookup-service:v14.2.2
    environment:
      ALS_DATABASE_URI: mysql://mojaloop:${MOJALOOP_MYSQL_PASSWORD:-mojaloop_pass}@mojaloop-mysql:3306/central_ledger
      ALS_CENTRAL_LEDGER_URL: http://central-ledger:3001
      LOG_LEVEL: info
    ports:
      - "4002:4002"
    depends_on:
      mojaloop-mysql: { condition: service_healthy }
      central-ledger: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [nexcom]

  quoting-service:
    image: mojaloop/quoting-service:v15.5.0
    environment:
      QS_DATABASE_URI: mysql://mojaloop:${MOJALOOP_MYSQL_PASSWORD:-mojaloop_pass}@mojaloop-mysql:3306/central_ledger
      QS_CENTRAL_LEDGER_URL: http://central-ledger:3001
      QS_KAFKA_HOST: kafka
      QS_KAFKA_PORT: "9092"
      LOG_LEVEL: info
    ports:
      - "3002:3002"
    depends_on:
      mojaloop-mysql: { condition: service_healthy }
      central-ledger: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [nexcom]

  central-settlement:
    image: mojaloop/central-settlement:v16.0.0
    environment:
      CS_DATABASE_URI: mysql://mojaloop:${MOJALOOP_MYSQL_PASSWORD:-mojaloop_pass}@mojaloop-mysql:3306/central_ledger
      CS_CENTRAL_LEDGER_URL: http://central-ledger:3001
      CS_KAFKA_HOST: kafka
      CS_KAFKA_PORT: "9092"
      LOG_LEVEL: info
    ports:
      - "3007:3007"
    depends_on:
      mojaloop-mysql: { condition: service_healthy }
      central-ledger: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [nexcom]

  # ─── OpenSearch (Full-Text Search + Postgres CDC Sync) ─────────────────────

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: nexcom-opensearch
    environment:
      - cluster.name=nexcom-search
      - node.name=nexcom-opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [nexcom]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: nexcom-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch: { condition: service_healthy }
    networks: [nexcom]

  opensearch-sync:
    build:
      context: ./services/opensearch-sync
      dockerfile: Dockerfile
    container_name: nexcom-opensearch-sync
    environment:
      POSTGRES_URL: postgres://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      OPENSEARCH_URL: http://opensearch:9200
      SYNC_INTERVAL_SECONDS: "30"
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexcom]

  # ─── Temporal Workflow Engine ──────────────────────────────────────────────

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: nexcom-temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=nexcom
      - POSTGRES_PWD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=false
    ports:
      - "7233:7233"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7233 || true"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks: [nexcom]

  temporal-setup:
    image: temporalio/admin-tools:1.24.2
    container_name: nexcom-temporal-setup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Temporal to be ready..."
        until tctl --address temporal:7233 cluster health 2>/dev/null | grep -q "SERVING"; do
          sleep 3
        done
        echo "Temporal is ready. Registering nexcom namespace..."
        tctl --address temporal:7233 --namespace nexcom namespace describe 2>/dev/null           && echo "Namespace nexcom already exists"           || tctl --address temporal:7233 --namespace nexcom namespace register                --retention 30                --description "NEXCOM Exchange — production workflow namespace"                --history-archival-state disabled                --visibility-archival-state disabled
        echo "Namespace registration complete."
    environment:
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"
    networks: [nexcom]

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: nexcom-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:8080"
    ports:
      - "8233:8080"
    depends_on:
      - temporal
    networks: [nexcom]

  temporal-worker:
    build:
      context: ./services/middleware-hub
      dockerfile: Dockerfile
    container_name: nexcom-temporal-worker
    command: ["/app/middleware-hub", "--mode=worker"]
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: nexcom
      TEMPORAL_TASK_QUEUE: nexcom-main
      POSTGRES_URL: postgres://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      # Ledger ops route via the gateway ledger API (TB has no HTTP interface)
      GATEWAY_URL: http://gateway:8200
      TIGERBEETLE_ADDRESS: tigerbeetle:3001
      DAPR_HTTP_PORT: "3500"
      LOG_LEVEL: info
    depends_on:
      - temporal
      - temporal-setup
      - kafka
      - redis
      - postgres
    restart: unless-stopped
    networks: [nexcom]

  # ─── Permify RBAC Engine ───────────────────────────────────────────────────

  permify:
    image: ghcr.io/permify/permify:v0.9.6
    container_name: nexcom-permify
    command:
      - serve
      - --database-engine=postgres
      - --database-uri=postgres://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      - --database-pool-max=10
      - --grpc-port=3478
      - --http-port=3476
      - --log-level=info
    ports:
      - "3476:3476"
      - "3478:3478"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3476/healthz || true"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexcom]

  # ─── Permify schema init (runs once after Permify is healthy) ─────────────
  # Run with: docker compose --profile init up permify-init
  permify-init:
    build:
      context: .                           # project root so permify.perm is in scope
      dockerfile: infra/permify/Dockerfile
    container_name: nexcom-permify-init
    restart: on-failure                    # retry if Permify isn't ready yet
    environment:
      PERMIFY_HOST: permify
      PERMIFY_HTTP_PORT: "3476"
      PERMIFY_TENANT_ID: t1
      SCHEMA_FILE: /app/permify.perm
    depends_on:
      permify:
        condition: service_healthy         # wait for Permify's own healthcheck
    networks: [nexcom]
    profiles: ["init"]                     # opt-in: not started by default

  # ─── APISIX API Gateway + etcd ─────────────────────────────────────────────

  etcd:
    image: bitnami/etcd:3.5.12
    container_name: nexcom-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - apisix_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [nexcom]

  # ─── Scheduled backups (opt-in: docker compose --profile backup up -d backup) ─
  # Runs scripts/backup/postgres-backup.sh on a daily loop; dumps land in the
  # backup_data volume (mirror it off-box for real DR — see docs/DISASTER_RECOVERY.md).
  backup:
    image: postgres:16-alpine   # pg_dump version must match the server (postgres:16-alpine)
    container_name: nexcom-backup
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: nexcom
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: nexcom
      BACKUP_DIR: /backups/postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backup_data:/backups
      - ./scripts/backup:/scripts:ro
    command: ["/bin/sh", "-c", "while true; do /scripts/postgres-backup.sh || echo '[backup] run failed'; sleep $$BACKUP_INTERVAL_SECONDS; done"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [nexcom]

  # ─── ML platform stack (opt-in: docker compose --profile ml up) ───────────
  # Merged from the ML-SERVE overlay (docker-compose.ml.yml). ml-platform serving
  # (:8015), MLflow tracking (:5000, sqlite backend on mlflow_data, artifacts on
  # model_registry_data), Ray head+worker (CPU), Neo4j 5 community (GNN graph store).
  ml-platform:
    build:
      context: services/ml-platform
      dockerfile: Dockerfile
    container_name: nexcom-ml-platform
    profiles: ["ml"]
    environment:
      ML_PLATFORM_PORT: "8015"
      LAKEHOUSE_PATH: /data/lakehouse
      REGISTRY_PATH: /data/model_registry
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RAY_ADDRESS: ray://ray-head:10001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexcom-neo4j-dev}
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      ALERT_WEBHOOK_URL: http://middleware-hub:8093/api/fraud-alerts
      AB_CHALLENGER_PCT: "0"
      ML_PLATFORM_NUM_THREADS: "2"
    volumes:
      - lakehouse_data:/data/lakehouse
      - model_registry_data:/data/model_registry
    ports:
      - "8015:8015"
    depends_on:
      mlflow: { condition: service_started }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8015/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [nexcom]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: nexcom-mlflow
    profiles: ["ml"]
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /artifacts
    volumes:
      - mlflow_data:/mlflow              # sqlite backend store
      - model_registry_data:/artifacts   # artifact root (shared with ai-ml models)
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [nexcom]
    restart: unless-stopped

  ray-head:
    image: rayproject/ray:2.49.1-py312-cpu
    container_name: nexcom-ray-head
    profiles: ["ml"]
    command: >
      ray start --head --dashboard-host 0.0.0.0 --block
    environment:
      RAY_ADDRESS: ray://ray-head:10001
    ports:
      - "8265:8265"    # Ray dashboard
      - "10001:10001"  # Ray client server
      # Host port 16379: container GCS is 6379 but host 6379 is already redis.
      - "16379:6379"   # Ray GCS
    shm_size: "1g"
    healthcheck:
      test: ["CMD-SHELL", "ray status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [nexcom]
    restart: unless-stopped

  ray-worker:
    image: rayproject/ray:2.49.1-py312-cpu
    container_name: nexcom-ray-worker
    profiles: ["ml"]
    command: >
      ray start --address ray-head:6379 --block
    environment:
      RAY_ADDRESS: ray://ray-head:10001
    depends_on:
      ray-head: { condition: service_healthy }
    shm_size: "1g"
    networks: [nexcom]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: nexcom-neo4j
    profiles: ["ml"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexcom-neo4j-dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [nexcom]
    restart: unless-stopped

  # ─── open-appsec WAF agent (opt-in: docker compose --profile waf up) ──────
  # Mirrors gateway/docker-compose.gateway.yml. The agent enforces the local
  # policy (./gateway/open-appsec/appsec-localconfig/local_policy.yaml) offline.
  # Full request interception requires the openappsec-bundled APISIX attachment
  # (see gateway/docker-compose.gateway.yml); in this default stack the custom
  # openappsec-waf Lua plugin is mounted into APISIX instead, and this agent is
  # reachable in the apisix network namespace via network_mode: service:apisix.
  openappsec-agent:
    image: ghcr.io/openappsec/agent:latest
    container_name: nexcom-openappsec-agent
    profiles: ["waf"]
    ipc: host                      # required for open-appsec IPC
    restart: unless-stopped
    environment:
      - user_email=${APPSEC_USER_EMAIL:-security@nexcom.exchange}
      - registered_server=APISIX
      # AGENT_TOKEN only needed for cloud-connected mode; empty = offline local policy
      - AGENT_TOKEN=${APPSEC_AGENT_TOKEN:-}
    volumes:
      - ./gateway/open-appsec/appsec-config:/etc/cp/conf
      - ./gateway/open-appsec/appsec-localconfig:/ext/appsec
      - appsec_data:/etc/cp/data
      - appsec_logs:/var/log/nano_agent
    command: /cp-nano-agent --standalone
    network_mode: "service:apisix"
    depends_on:
      - apisix
    healthcheck:
      # The agent exposes no HTTP /health — presence of the nano agent log is
      # the documented liveness signal (same as gateway/docker-compose.gateway.yml).
      test: ["CMD", "test", "-f", "/var/log/nano_agent/nano_agent.log"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: nexcom-apisix
    volumes:
      - ./services/middleware-hub/internal/apisix/apisix.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./services/middleware-hub/internal/apisix/nexcom-routes.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # Custom WAF plugin listed in apisix.yaml `plugins:` — must be mounted or
      # APISIX fails to start (plugin not found). extra_lua_path resolves it.
      - ./services/middleware-hub/internal/apisix/openappsec/openappsec-waf.lua:/usr/local/apisix/apisix/plugins/openappsec-waf.lua:ro
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9091:9091"
    depends_on:
      etcd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/apisix/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexcom]

  # ─── Dapr Placement Service ────────────────────────────────────────────────

  dapr-placement:
    image: daprio/dapr:1.13.4
    container_name: nexcom-dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks: [nexcom]

  portal-dapr:
    image: daprio/daprd:1.13.4
    container_name: nexcom-portal-dapr
    command:
      - ./daprd
      - --app-id=nexcom-portal
      - --app-port=3000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --placement-host-address=dapr-placement:50006
      - --components-path=/components
      - --log-level=info
    volumes:
      - ./infra/dapr/components:/components:ro
    depends_on:
      - dapr-placement
      - kafka
      - redis
    network_mode: "service:portal"

  # ─── Channel Services (USSD / WhatsApp / Telegram) ────────────────────────

  ussd-engine:
    build:
      context: services/ussd-engine
      dockerfile: Dockerfile
    container_name: nexcom-ussd-engine
    environment:
      PORT: "8020"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-sandbox}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      PORTAL_URL: http://portal:3000
    ports:
      - "8020:8020"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped

  channel-gateway:
    build:
      context: services/channel-gateway
      dockerfile: Dockerfile
    container_name: nexcom-channel-gateway
    environment:
      PORT: "8021"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-nexcom_verify}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_LOGIC_URL: http://bot-logic:8022
    ports:
      - "8021:8021"
    depends_on:
      kafka: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped

  bot-logic:
    build:
      context: services/bot-logic
      dockerfile: Dockerfile
    container_name: nexcom-bot-logic
    environment:
      PORT: "8022"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      KAFKA_BROKERS: kafka:9092
      CHANNEL_GATEWAY_URL: http://channel-gateway:8021
      PORTAL_URL: http://portal:3000
    ports:
      - "8022:8022"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped

  # ─── Core Banking Integration ──────────────────────────────────────────────

  core-banking:
    build:
      context: services/core-banking
      dockerfile: Dockerfile
    container_name: nexcom-core-banking
    environment:
      PORT: "8023"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      CBS_ADAPTER: ${CBS_ADAPTER:-generic}
      CBS_BASE_URL: ${CBS_BASE_URL:-http://localhost:9090}
      CBS_API_KEY: ${CBS_API_KEY:-}
    ports:
      - "8023:8023"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped

  # ─── Commodity Indices Service (gRPC) ─────────────────────────────────────

  indices:
    build:
      context: services/indices
      dockerfile: Dockerfile
    container_name: nexcom-indices
    environment:
      GRPC_PORT: "8024"
      HTTP_PORT: "8025"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - "8024:8024"
      - "8025:8025"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped

  # ─── Developer Tools (opt-in with --profile tools) ────────────────────────

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexcom-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: nexcom
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      # Host port 18091: 8090 is fluvio-sidecar, 8091 is aml-alert-subscriber.
      - "18091:8080"
    depends_on:
      kafka: { condition: service_healthy }
    networks: [nexcom]
    profiles: ["tools"]

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: nexcom-redis-insight
    ports:
      # Host port 5540 (redis-insight convention); host 8001 was trading-engine (service removed by FIX-MOCKWARE).
      - "5540:8001"
    depends_on:
      - redis
    networks: [nexcom]
    profiles: ["tools"]

  # ─── Credit Scoring Engine (Rust) ─────────────────────────────────────────
  credit-scoring:
    build:
      context: services/credit-scoring
      dockerfile: Dockerfile
    container_name: nexcom-credit-scoring
    environment:
      CREDIT_SCORING_PORT: "8089"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      REDIS_URL: redis://redis:6379
      CORE_BANKING_URL: http://core-banking:8083
      MIN_SCORE_AUTO_APPROVE: "680"
      MIN_SCORE_MANUAL_REVIEW: "550"
      MAX_DTI_RATIO: "0.45"
      MAX_LOAN_TO_INCOME_RATIO: "3.0"
      RUST_LOG: info
    ports:
      - "8089:8089"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── AML Alert Subscriber (Go/Dapr) ───────────────────────────────────────
  aml-alert-subscriber:
    build:
      context: services/aml-alert-subscriber
      dockerfile: Dockerfile
    container_name: nexcom-aml-alert-subscriber
    environment:
      AML_PORT: "8091"
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      # Portal service DNS name is `portal` (no `nexcom` service exists)
      ALERT_WEBHOOK_URL: ${AML_ALERT_WEBHOOK_URL:-http://portal:3000/api/aml-alerts}
      SAR_AUTO_FILE_THRESHOLD: "3"
    ports:
      - "8091:8091"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Market Data Service (Go) ─────────────────────────────────────────────
  middleware-hub:
    build:
      context: services/middleware-hub
      dockerfile: Dockerfile
    container_name: nexcom-middleware-hub
    environment:
      MIDDLEWARE_HUB_PORT: "8093"
      # Ledger ops route via the gateway ledger API (TB has no HTTP interface)
      GATEWAY_URL: http://gateway:8200
      DATABASE_URL: postgresql://nexcom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexcom
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      CORE_BANKING_URL: http://core-banking:8083
      CHANNEL_GATEWAY_URL: http://channel-gateway:8082
      MOJALOOP_URL: http://ml-api-adapter:3000
      USSD_ENGINE_URL: http://ussd-engine:8080
      BOT_LOGIC_URL: http://bot-logic:3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8093:8093"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nexcom]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Crypto Guard (Rust — Replay Prevention, HMAC, Idempotency) ──────────
  crypto-guard:
    build:
      context: services/crypto-guard
      dockerfile: Dockerfile
    container_name: nexcom-crypto-guard
    environment:
      CRYPTO_GUARD_PORT: "7070"
      HMAC_SECRET: ${HMAC_SECRET:-nexcom-hmac-secret-change-in-production}
      NONCE_TTL_SECONDS: "300"
      IDEMPOTENCY_TTL_SECONDS: "86400"
      MAX_TIMESTAMP_DRIFT_SECONDS: "30"
    ports:
      - "7070:7070"
    networks: [nexcom]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Fraud Engine (Python/ML — Wash Trade, AML, Behavioral Anomaly) ──────
  fraud-engine:
    build:
      context: services/fraud-engine
      dockerfile: Dockerfile
    container_name: nexcom-fraud-engine
    environment:
      FRAUD_ENGINE_PORT: "7071"
      RISK_THRESHOLD_HIGH: "0.7"
      RISK_THRESHOLD_MEDIUM: "0.4"
      VELOCITY_WINDOW_SECONDS: "300"
      ALERT_WEBHOOK_URL: http://middleware-hub:8093/api/fraud-alerts
      # Points at the ml-platform serving API (active with --profile ml)
      ML_PLATFORM_URL: http://ml-platform:8015
    ports:
      - "7071:7071"
    networks: [nexcom]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7071/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── DDoS Guard (Go — Rate Limiting, IP Reputation, Circuit Breaker) ─────
  ddos-guard:
    build:
      context: services/ddos-guard
      dockerfile: Dockerfile
    container_name: nexcom-ddos-guard
    environment:
      DDOS_GUARD_PORT: "7072"
      RATE_LIMIT_REQUESTS_PER_SECOND: "100"
      RATE_LIMIT_BURST: "200"
      BLOCK_DURATION_SECONDS: "300"
      MAX_CONNECTIONS_PER_IP: "50"
      SLOW_LORIS_TIMEOUT_SECONDS: "10"
      CIRCUIT_BREAKER_THRESHOLD: "50"
      CIRCUIT_BREAKER_WINDOW_SECONDS: "60"
      UPSTREAM_URL: http://nexcom-app:3000
    ports:
      - "7072:7072"
    networks: [nexcom]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7072/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── Journey Orchestrator (Go — Temporal Worker + HTTP API for all 20 journeys) ─
  journey-orchestrator-worker:
    build:
      context: journey-orchestrator
      dockerfile: Dockerfile
    container_name: nexcom-journey-worker
    environment:
      MODE: worker
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: nexcom
      PORTAL_URL: http://portal:3000
      GATEWAY_URL: http://gateway:8200
      MATCHING_ENGINE_URL: http://matching-engine:8080
      SETTLEMENT_ENGINE_URL: http://settlement-engine:8005
      KYC_SERVICE_URL: http://kyc-service:8003
      RISK_SERVICE_URL: http://risk-management:8004
      ANALYTICS_SERVICE_URL: http://analytics:8006
      AI_ML_SERVICE_URL: http://ai-ml:8007
      NOTIFICATION_SERVICE_URL: http://notification:8008
      INGESTION_SERVICE_URL: http://ingestion-engine:8009
      BLOCKCHAIN_SERVICE_URL: http://blockchain:8010
      USER_MANAGEMENT_URL: http://user-management:8012
      CREDIT_SCORING_URL: http://credit-scoring:8089
      USSD_ENGINE_URL: http://ussd-engine:8020
      MIDDLEWARE_HUB_URL: http://middleware-hub:8013
      MOJALOOP_HUB_URL: http://mojaloop-adapter:4001
      FLUVIO_HTTP_URL: ${FLUVIO_HTTP_URL:-http://fluvio-sidecar:8090}
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    networks: [nexcom]
    restart: unless-stopped
    depends_on:
      - temporal
      - kafka
      - redis
      - portal
      - gateway
      - matching-engine
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  journey-orchestrator-api:
    build:
      context: journey-orchestrator
      dockerfile: Dockerfile
    container_name: nexcom-journey-api
    environment:
      MODE: api
      JOURNEY_API_PORT: "8015"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: nexcom
    ports:
      # Host port 18015: 8015 on the host is ml-platform. Container port unchanged.
      - "18015:8015"
    networks: [nexcom]
    restart: unless-stopped
    depends_on:
      - temporal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
