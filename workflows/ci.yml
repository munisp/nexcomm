name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NEXCOM_PG_URL: postgresql://nexcom:nexcom_ci_2026@localhost:5432/nexcom_ci
  DATABASE_URL: postgresql://nexcom:nexcom_ci_2026@localhost:5432/nexcom_ci
  JWT_SECRET: ci-test-jwt-secret-32-chars-minimum
  VITE_APP_ID: ci-test-app-id
  OAUTH_SERVER_URL: http://localhost:9999
  VITE_OAUTH_PORTAL_URL: http://localhost:9999
  OWNER_OPEN_ID: ci-owner
  OWNER_NAME: CI Owner
  BUILT_IN_FORGE_API_URL: http://localhost:9998
  BUILT_IN_FORGE_API_KEY: ci-forge-key
  VITE_FRONTEND_FORGE_API_KEY: ci-frontend-forge-key
  VITE_FRONTEND_FORGE_API_URL: http://localhost:9998
  AFRICASTALKING_API_KEY: ci-at-key
  AFRICASTALKING_USERNAME: sandbox
  TELEGRAM_BOT_TOKEN: 0000000000:ci-test-token
  WHATSAPP_ACCESS_TOKEN: ci-whatsapp-token
  WHATSAPP_PHONE_NUMBER_ID: "000000000000000"
  WHATSAPP_VERIFY_TOKEN: ci-verify-token
  SENDGRID_API_KEY: SG.ci-test-key
  OPENSANCTIONS_API_KEY: ci-opensanctions-key
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

jobs:
  # ─── TypeScript / Node.js Tests ───────────────────────────────────────────
  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nexcom
          POSTGRES_PASSWORD: nexcom_ci_2026
          POSTGRES_DB: nexcom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migration
        run: |
          python3 nexcom-tools/generate_migration.py \
            --drizzle-dir drizzle \
            --output /tmp/ci_migration.sql
          psql "$NEXCOM_PG_URL" -f /tmp/ci_migration.sql 2>&1 | \
            grep -E "^ERROR|^FATAL" | head -5 || true
        env:
          NEXCOM_PG_URL: ${{ env.NEXCOM_PG_URL }}

      - name: Run TypeScript tests
        run: pnpm test

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

  # ─── Go Tests ─────────────────────────────────────────────────────────────
  go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test channel-gateway
        working-directory: services/channel-gateway
        run: |
          go mod download
          go test ./... -v -timeout 60s 2>&1 | tail -20
        continue-on-error: true

      - name: Test mojaloop-adapter
        working-directory: services/mojaloop-adapter
        run: |
          go mod download
          go test ./... -v -timeout 60s 2>&1 | tail -20
        continue-on-error: true

      - name: Test indices-service
        working-directory: services/indices-service
        run: |
          go mod download
          go test ./... -v -timeout 60s 2>&1 | tail -20
        continue-on-error: true

      - name: Test market-data
        working-directory: services/market-data
        run: |
          go mod download
          go test ./... -v -timeout 60s 2>&1 | tail -20
        continue-on-error: true

      - name: Build all Go services
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          for svc in services/*/; do
            if [ -f "$svc/go.mod" ]; then
              echo "Building $svc..."
              (cd "$svc" && go build ./... 2>&1 | tail -3) || echo "  SKIP: $svc"
            fi
          done

  # ─── Rust Tests ───────────────────────────────────────────────────────────
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libssl-dev libsasl2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/ussd-engine
            services/credit-scoring
            services/blockchain-bridge
            nexcom-tools/schema-diff

      - name: Test ussd-engine
        working-directory: services/ussd-engine
        run: |
          cargo test --lib 2>&1 | tail -20
        continue-on-error: true

      - name: Test credit-scoring
        working-directory: services/credit-scoring
        run: |
          cargo test --lib 2>&1 | tail -20
        continue-on-error: true

      - name: Build schema-diff validator
        working-directory: nexcom-tools/schema-diff
        run: cargo build --release 2>&1 | tail -5

  # ─── Python Tests ─────────────────────────────────────────────────────────
  python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pytest pytest-asyncio httpx fastapi uvicorn sqlalchemy psycopg2-binary
          if [ -f services/bot-logic/requirements.txt ]; then
            pip install -r services/bot-logic/requirements.txt 2>&1 | tail -5 || true
          fi

      - name: Test migration generator
        run: |
          python3 nexcom-tools/generate_migration.py \
            --drizzle-dir drizzle \
            --output /tmp/test_migration.sql
          echo "Generated $(wc -l < /tmp/test_migration.sql) lines"
          # Verify key tables are present
          grep -c "CREATE TABLE IF NOT EXISTS" /tmp/test_migration.sql

      - name: Test bot-logic
        working-directory: services/bot-logic
        run: |
          python3 -m pytest tests/ -v --timeout=30 2>&1 | tail -20
        continue-on-error: true

      - name: Test kyc-service
        working-directory: services/kyc-service
        run: |
          python3 -m pytest tests/ -v --timeout=30 2>&1 | tail -20
        continue-on-error: true

  # ─── Schema Drift Check ───────────────────────────────────────────────────
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    needs: [typescript]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nexcom
          POSTGRES_PASSWORD: nexcom_ci_2026
          POSTGRES_DB: nexcom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply migration
        run: |
          python3 nexcom-tools/generate_migration.py \
            --drizzle-dir drizzle \
            --output /tmp/ci_migration.sql
          psql "$NEXCOM_PG_URL" -f /tmp/ci_migration.sql 2>&1 | \
            grep -E "^ERROR|^FATAL" | head -5 || true

      - name: Build and run schema-diff validator
        working-directory: nexcom-tools/schema-diff
        run: |
          cargo build --release 2>&1 | tail -3
          ./target/release/schema-diff --dsn "$NEXCOM_PG_URL" \
            --expected-tables "users,profiles,watchlist,price_alerts,notifications,audit_log,live_prices,orders,trade_fills,settlements,bank_transactions,input_financing_loans,farm_profiles,farmer_profiles,warehouses,commodity_indexes,instruments,pre_trade_risk_checks,kyc_queue"
