<!--
  NEXCOM Exchange - Wazuh SIEM Configuration
  Security monitoring, threat detection, and compliance
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <email_notification>yes</email_notification>
    <email_to>security@nexcom.exchange</email_to>
    <smtp_server>smtp.nexcom.exchange</smtp_server>
    <email_from>wazuh@nexcom.exchange</email_from>
    <email_maxperhour>12</email_maxperhour>
  </global>

  <!-- Vulnerability detection -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- File integrity monitoring for exchange configs -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>600</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Monitor critical exchange configuration files -->
    <directories check_all="yes" realtime="yes">/etc/nexcom</directories>
    <directories check_all="yes" realtime="yes">/opt/nexcom/config</directories>

    <!-- Monitor Kubernetes manifests -->
    <directories check_all="yes">/etc/kubernetes</directories>

    <!-- Ignore dynamic data -->
    <ignore>/var/log</ignore>
    <ignore>/tmp</ignore>
  </syscheck>

  <!-- Log analysis for exchange-specific events -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nexcom/trading-engine.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nexcom/settlement.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nexcom/user-management.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nexcom/apisix-access.log</location>
  </localfile>

  <!-- NEXCOM Exchange custom rules -->
  <ruleset>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>

    <!-- Exchange-specific rule files -->
    <rule_dir>etc/rules/nexcom</rule_dir>
  </ruleset>

  <!-- Active response for exchange security events -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100100</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- Integration with OpenSearch for centralized logging -->
  <integration>
    <name>opensearch</name>
    <hook_url>http://opensearch:9200</hook_url>
    <alert_format>json</alert_format>
  </integration>

  <!-- Integration with OpenCTI for threat intelligence -->
  <integration>
    <name>custom-opencti</name>
    <hook_url>http://opencti:8088/api/stix</hook_url>
    <alert_format>json</alert_format>
    <level>10</level>
  </integration>

  <!-- Regulatory compliance checks -->
  <wodle name="cis-cat">
    <disabled>no</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
  </wodle>
</ossec_config>
