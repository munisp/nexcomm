##############################################################################
# NEXCOM Exchange - OpenCTI Deployment
# Cyber threat intelligence platform for exchange security
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencti
  namespace: nexcom-security
  labels:
    app: opencti
    app.kubernetes.io/part-of: nexcom-exchange
    tier: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencti
  template:
    metadata:
      labels:
        app: opencti
    spec:
      containers:
        - name: opencti
          image: opencti/platform:6.0.10
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=8096"
            - name: APP__PORT
              value: "8088"
            - name: APP__BASE_URL
              value: "http://opencti:8088"
            - name: APP__ADMIN__EMAIL
              value: "admin@nexcom.exchange"
            - name: APP__ADMIN__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencti-secret
                  key: admin-password
            - name: APP__ADMIN__TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencti-secret
                  key: admin-token
            - name: REDIS__HOSTNAME
              value: "redis"
            - name: REDIS__PORT
              value: "6379"
            - name: ELASTICSEARCH__URL
              value: "http://opensearch:9200"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 120
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: opencti
  namespace: nexcom-security
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
  selector:
    app: opencti
---
# OpenCTI connectors for exchange-relevant threat feeds
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencti-connector-mitre
  namespace: nexcom-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencti-connector-mitre
  template:
    metadata:
      labels:
        app: opencti-connector-mitre
    spec:
      containers:
        - name: connector
          image: opencti/connector-mitre:6.0.10
          env:
            - name: OPENCTI_URL
              value: "http://opencti:8088"
            - name: OPENCTI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencti-secret
                  key: admin-token
            - name: CONNECTOR_ID
              value: "mitre-attack"
            - name: CONNECTOR_TYPE
              value: "EXTERNAL_IMPORT"
            - name: CONNECTOR_NAME
              value: "MITRE ATT&CK"
            - name: CONNECTOR_SCOPE
              value: "identity,attack-pattern,course-of-action,intrusion-set,malware,tool"
            - name: CONNECTOR_CONFIDENCE_LEVEL
              value: "75"
            - name: CONNECTOR_UPDATE_EXISTING_DATA
              value: "true"
            - name: MITRE_INTERVAL
              value: "7"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
